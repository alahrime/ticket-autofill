name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shop-web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: shop-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: shop-web/package-lock.json
      - run: npm ci
      - run: npx nx run-many -t lint typecheck test build
      - run: node tools/parity-guard.mjs
      - run: npx playwright install chromium
      - run: npx nx e2e pages-e2e

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run the test scripts
        shell: bash
        run: |
          for f in tests/test_*.py; do
            python "$f" || exit 1
          done
