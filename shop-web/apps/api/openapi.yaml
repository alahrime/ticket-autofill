# The shop's JSON API (shop.py's, ported to apps/api). The server checks requests against this file, and
# libs/api-client is generated from it (npx nx run api-client:generate; commit the result).
#
# Every /api/ route needs a session (the `sid` cookie from POST /login/admin or /login/tech): without one the
# reply is 401 {"error": "sign in"}; with the wrong role, 403 {"error": "not allowed"}. Both come before any
# body is read. A POST body must be a JSON object sent as `Content-Type: application/json`, at most 1 MB and
# nested at most 64 deep; else 400 {"error"}. A POST from another site is 403. Errors never echo the input.
#
# Request validation (src/http/contract.ts) runs after the sign-in and role gates and the body rules. A schema
# marked `x-checked-in: domain` or `x-checked-in: route` documents what to send, but the ticket / account rules
# or the route check it, with their own messages, field errors ({error, errors}) and order, so the validator
# accepts anything there. `x-error` is the message a failed check of that schema replies with.
# Examples are made up (Jane Testcase, 555 010 0000): no customer data here.
openapi: 3.1.0
info:
  title: Shop API
  version: 1.0.0
  description: The JSON API behind web/admin.html (the desk) and web/tech.html (the mechanics' phones).
servers:
  - url: /
security:
  - session: []

tags:
  - name: session
  - name: tickets
  - name: catalog
  - name: users
  - name: upkeep
  - name: bills
  - name: jobs

paths:
  /api/me:
    get:
      operationId: getMe
      tags: [session]
      summary: Who is signed in on this device
      responses:
        '200':
          description: The session's role, name and user id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/SignIn' }

  /api/tickets:
    get:
      operationId: listTickets
      tags: [tickets]
      summary: The tickets this caller sees
      description: |
        Admin: every ticket. Mechanic: waiting ones nobody else was given, and their own working and approved
        ones. Deleted tickets are listed only when the admin asks for `deleted` (a mechanic asking gets none);
        each then carries `purge_on`. The reply has an ETag; the pages poll with If-None-Match and get 304 when
        nothing changed.
      parameters:
        - name: status
          in: query
          description: |
            Comma-separated statuses to keep (may repeat); unknown ones are dropped. None given = all but deleted.
            `deleted` is the admin's only.
          schema: { type: string }
          example: waiting,working,approved
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: The tickets, newest first, each as the caller's role sees it.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets:
                    type: array
                    items: { $ref: '#/components/schemas/ListedTicket' }
        '304':
          description: Not changed since the If-None-Match ETag.
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
    post:
      operationId: createTicket
      tags: [tickets]
      summary: A new ticket (the desk's whole invoice, or a mechanic's check-in)
      description: |
        Admin: a NewTicket, the whole invoice at once. Mechanic: a CheckIn; every other key is dropped and the
        ticket waits, unassigned. The reply is the new ticket as the caller's role sees it. A `token` (8 to 64
        characters, one per new ticket on the page) sent again by the same account replies with the ticket it
        made instead of a second one, answered as GET /api/tickets/{id} would answer this caller now: 404 once
        they may no longer see it (a mechanic's check-in the desk has given to someone else), 410 for a
        mechanic's deleted one. A replay never makes a deleted ticket again; one purged since makes a new one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - $ref: '#/components/schemas/NewTicket'
                - $ref: '#/components/schemas/CheckIn'
            example:
              first: Jane
              last: Testcase
              phone: 555 010 0000
              year: '2019'
              make: Cadillac
              model: XT5
              plate: tst-0001
              request: brakes squeak
              token: tok-00000002
      responses:
        '200':
          description: The ticket made (or the one this token made before).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/tickets/{id}:
    get:
      operationId: getTicket
      tags: [tickets]
      summary: One ticket
      description: |
        A mechanic also sees their own ticket in review. Someone else's is 404. A deleted ticket: the admin's
        200; 410 for a mechanic who could see it before it was deleted; 404 for anyone else.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      responses:
        '200':
          description: The ticket as the caller's role sees it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
    post:
      operationId: editTicket
      tags: [tickets]
      summary: Change a ticket's fields
      description: |
        Only the keys sent change. `version` is the copy the device saw: another device's save in between is
        409 with the stored ticket. A mechanic edits only their own working or approved job, and only lines,
        odometer, vin and notes. A deleted ticket: 409 for the admin (restore it first), 410 or 404 for a
        mechanic.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Edit' }
            example:
              version: 1
              notes: customer will wait
              lines:
                - { desc: front brake pads, qty: 1, price: '100', labor: '100', code: FBP }
              deposits:
                - { amount: 50, method: cash }
      responses:
        '200':
          description: The saved ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/tickets/{id}/move:
    post:
      operationId: moveTicket
      tags: [tickets]
      summary: Move a ticket to another status
      description: |
        waiting>working, working>review, review>working (needs a note), review>approved, approved>filled,
        waiting>approved, working>approved. A mechanic only accepts (as themselves) and finishes; the desk
        accepting for a mechanic names one. No move reaches `deleted` (that is POST .../delete). A deleted
        ticket: 409 for the admin, 410 or 404 for a mechanic.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Move' }
            example:
              version: 2
              to: working
              mechanic: Al Fixit
      responses:
        '200':
          description: The moved ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/tickets/{id}/delete:
    post:
      operationId: deleteTicket
      tags: [tickets]
      summary: Delete a ticket (it can be restored)
      description: |
        The admin deletes any ticket; a mechanic, any one they may open (their own, or a waiting one nobody was
        given). Deleted from waiting, working or review with no deposit, it is removed for good 14 days later;
        a deleted approved or filled ticket, or one with any deposit, is kept until restored. Already deleted,
        or a stale version: 409. The only 403 is the one every POST from another site gets.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Versioned' }
            example:
              version: 3
      responses:
        '200':
          description: The deleted ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }

  /api/tickets/{id}/restore:
    post:
      operationId: restoreTicket
      tags: [tickets]
      summary: Put a deleted ticket back where it was (admin)
      description: Back to the status it was deleted from. Not deleted, or a stale version, is 409.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Versioned' }
            example:
              version: 4
      responses:
        '200':
          description: The restored ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/vehicles:
    get:
      operationId: getVehicles
      tags: [catalog]
      summary: Makes, their models and model years (vehicles.json)
      responses:
        '200':
          description: Make -> model -> [first year, last year]; {} when the file is missing or bad.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vehicles' }
        '401': { $ref: '#/components/responses/SignIn' }

  /api/catalog:
    get:
      operationId: getCatalog
      tags: [catalog]
      summary: Part hints from parts.csv
      parameters:
        - name: q
          in: query
          description: Text to find in a part's code, description or aliases (any case). Empty = no hints.
          schema: { type: string }
          example: brake
      responses:
        '200':
          description: Up to 8 matching parts.
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items: { $ref: '#/components/schemas/Hint' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }

  /api/mechanics:
    get:
      operationId: listMechanics
      tags: [users]
      summary: Active mechanics' names (admin)
      responses:
        '200':
          description: Names, for the desk's pick list.
          content:
            application/json:
              schema:
                type: object
                required: [mechanics]
                properties:
                  mechanics:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }

  /api/users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Every account (admin)
      responses:
        '200':
          description: Accounts, by name; no hashes.
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
    post:
      operationId: addUser
      tags: [users]
      summary: A new account (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NewUser' }
            example:
              name: Cy Newhire
              role: mechanic
              secret: '11223344'
      responses:
        '200':
          description: The account made.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }

  /api/users/{id}:
    post:
      operationId: changeUser
      tags: [users]
      summary: Reset a PIN / password, or turn an account on or off (admin)
      description: |
        All or nothing: everything is checked before anything is written. A new secret or turning an account
        off signs it out everywhere; the last active admin stays on. Changing your own password signs this
        device back in (a new Set-Cookie).
      parameters:
        - name: id
          in: path
          required: true
          description: 1 to 9 digits; anything else is 404.
          schema: { type: integer, minimum: 0, maximum: 999999999 }
          example: 2
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserChange' }
            example:
              active: true
      responses:
        '200':
          description: The account as it is now.
          headers:
            Set-Cookie:
              description: Only when you changed your own password.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/upkeep/status:
    get:
      operationId: upkeepStatus
      tags: [upkeep]
      summary: How the backups and the InvoMax import stand (admin)
      description: |
        `backup.last` is the newest tickets backup's date and `backup.invomax` the newest invomax one; `stale` when
        either has none from the last 2 days. `offsite` is when the backups were last copied off this PC (null:
        never); `offsite_stale` when that is more than 7 days ago or the last copy failed (`offsite_failed`, its
        error class). `import.last` is the newest InvoMax import (null before any); `import.off` when
        shop-settings.json turns the import off (`"invomaxDir": null`). `needs_bill` counts the filled tickets with
        no bill linked, typed or marked none. `ownBilling` is true when shop-settings.json turns the app's own
        billing on (`"ownBilling": true`).
      responses:
        '200':
          description: The upkeep line.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Upkeep' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }

  /api/upkeep/import:
    post:
      operationId: startImport
      tags: [upkeep]
      summary: Check InvoMax now (admin)
      description: |
        Starts an import of InvoMax's bills in the background and replies at once; GET /api/upkeep/status says
        when it is done. A good import then links the bills it can to their tickets. It runs even while the
        automatic import is backing off after a failure. 409 while one is running; 400 when shop-settings.json
        turns the import off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Nothing' }
            example: {}
      responses:
        '202':
          description: Started.
          content:
            application/json:
              schema:
                type: object
                required: [started]
                properties:
                  started: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '409':
          description: An import is already running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: an import is already running }

  /api/upkeep/copy-backups:
    post:
      operationId: copyBackups
      tags: [upkeep]
      summary: Copy the backups to the USB drive (admin)
      description: |
        Copies the dated backups to each of shop-settings.json's `backupTargets` whose drive is in (a bare drive
        letter means `<drive>\shop-backups`), skipping files already there. 400 `no USB drive set up` with no
        target, `drive not found` when none of them is in; 409 while a copy is running.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Nothing' }
            example: {}
      responses:
        '200':
          description: What each target got.
          content:
            application/json:
              schema:
                type: object
                required: [copies]
                properties:
                  copies:
                    type: array
                    items: { $ref: '#/components/schemas/CopyResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '409':
          description: A copy is already running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: a copy is already running }

  /api/invoices:
    get:
      operationId: listInvoices
      tags: [bills]
      summary: Bill history, searched (admin)
      description: |
        Our filled tickets and InvoMax's bills, newest first, 50 a page. A ticket linked to its bill is one row
        keyed `im<no>`; a bill alone is `im<no>`; a filled ticket with no InvoMax bill is `t<id>`. Every filter
        is a partial match ignoring case, and they combine. `vin` searches our tickets only: InvoMax keeps no VIN.
      parameters:
        - name: name
          in: query
          description: Part of the first, last or full name (ours or InvoMax's).
          schema: { type: string, maxLength: 80 }
          example: jane
        - name: phone
          in: query
          description: Some of the phone's digits; punctuation is ignored.
          schema: { type: string, maxLength: 20, pattern: '^[0-9 ()+.-]*[0-9][0-9 ()+.-]*$', x-error: phone must be digits }
        - name: tag
          in: query
          description: Part of the plate; spaces and dashes are ignored.
          schema: { type: string, maxLength: 20 }
        - name: vin
          in: query
          description: Part of the VIN, on our tickets only.
          schema: { type: string, maxLength: 17 }
        - name: from
          in: query
          description: First day (YYYY-MM-DD).
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$', x-error: from must be a date (YYYY-MM-DD) }
        - name: to
          in: query
          description: Last day (YYYY-MM-DD).
          schema: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$', x-error: to must be a date (YYYY-MM-DD) }
        - name: page
          in: query
          description: 1 or more.
          schema: { type: string, pattern: '^[1-9][0-9]{0,5}$', x-error: page must be 1 or more }
          example: '1'
      responses:
        '200':
          description: One page of rows and how many match in all.
          content:
            application/json:
              schema:
                type: object
                required: [rows, total, page, per_page]
                properties:
                  rows:
                    type: array
                    items: { $ref: '#/components/schemas/BillRow' }
                  total: { type: integer }
                  page: { type: integer }
                  per_page: { type: integer, const: 50 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }

  /api/invoices/{key}:
    get:
      operationId: getInvoice
      tags: [bills]
      summary: One row of Bill history, both sides (admin)
      description: |
        `im<no>`: that InvoMax bill (one InvoMax no longer has too, marked `gone`) and the ticket linked to it.
        `t<id>`: a filled ticket; one linked to a bill is that pair (keyed `im<no>`).
      parameters:
        - $ref: '#/components/parameters/BillKey'
      responses:
        '200':
          description: The bill.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bill' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/customers/{phone}:
    get:
      operationId: getCustomer
      tags: [bills]
      summary: A customer's vehicles and their bills, by phone (admin)
      parameters:
        - name: phone
          in: path
          required: true
          description: The phone's digits (3 to 15); anything else, or no bills, is 404.
          schema: { type: string, pattern: '^[0-9]{3,15}$' }
          example: '5550100000'
      responses:
        '200':
          description: Their vehicles (by plate, else VIN), each with its rows, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/needs-bill:
    get:
      operationId: listNeedsBill
      tags: [bills]
      summary: Filled tickets with no bill yet (admin)
      description: The newest 200, newest filled first, each with up to 5 InvoMax bills that might be theirs.
      responses:
        '200':
          description: The tickets.
          content:
            application/json:
              schema:
                type: object
                required: [tickets]
                properties:
                  tickets:
                    type: array
                    items: { $ref: '#/components/schemas/NeedsBill' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }

  /api/invoices/{key}/link:
    post:
      operationId: linkInvoice
      tags: [bills]
      summary: Link a filled ticket to an InvoMax bill (admin)
      description: |
        Any bill InvoMax still has, typed by number or picked from the candidates. `version` is the link's as
        GET /api/invoices/{key} gave it (`link.version`; null when there was none): another is 409, as is a bill
        another ticket has. A `t<id>` key only; an `im` key is 404.
      parameters:
        - $ref: '#/components/parameters/TicketKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkIn' }
            example: { invoice_no: '9000001', version: null }
      responses:
        '200': { $ref: '#/components/responses/BillNow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Changed' }

  /api/invoices/{key}/unlink:
    post:
      operationId: unlinkInvoice
      tags: [bills]
      summary: Undo a ticket's link, typed bill or none (admin)
      description: An unlinked pair is never linked again by itself. 404 when there is nothing to undo.
      parameters:
        - $ref: '#/components/parameters/TicketKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkVersioned' }
            example: { version: 1 }
      responses:
        '200': { $ref: '#/components/responses/BillNow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Changed' }

  /api/invoices/{key}/none:
    post:
      operationId: markNoInvoice
      tags: [bills]
      summary: Mark a filled ticket as having no InvoMax bill (admin)
      parameters:
        - $ref: '#/components/parameters/TicketKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkVersioned' }
            example: { version: null }
      responses:
        '200': { $ref: '#/components/responses/BillNow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Changed' }

  /api/invoices/{key}/final:
    post:
      operationId: typeFinal
      tags: [bills]
      summary: Type a ticket's final bill by hand (admin)
      description: |
        For a bill InvoMax doesn't have. Dollars, to the cent, 0 to 1,000,000 each; `total` must be parts +
        labor + supplies + tax (no discount). The invoice number, if given, must be no other ticket's.
      parameters:
        - $ref: '#/components/parameters/TicketKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalIn' }
            example: { invoice_no: '9000002', parts: 120, labor: 90, supplies: 10.5, tax: 7.83, total: 228.33, version: 1 }
      responses:
        '200': { $ref: '#/components/responses/BillNow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Changed' }

  /api/job-map:
    get:
      operationId: listJobMap
      tags: [jobs]
      summary: InvoMax line groups, their proposed and accepted jobs, and the coverage (admin)
      description: |
        Part and labor lines on bills InvoMax still has, grouped: one group per code, but one per description
        words for a generic code (LABOR, INSTALL-). Biggest first (most lines), 100 a page. `proposed` is worked
        out on each request from parts.csv (whole words only); only accepted rules are stored.
      parameters:
        - name: unmapped
          in: query
          description: 1 lists only groups with a line no rule maps.
          schema: { type: string, enum: ['0', '1'], x-error: unmapped must be 0 or 1 }
          example: '1'
        - name: page
          in: query
          description: 1 or more.
          schema: { type: string, pattern: '^[1-9][0-9]{0,5}$', x-error: page must be 1 or more }
          example: '1'
      responses:
        '200':
          description: One page of groups and the coverage over all lines.
          content:
            application/json:
              schema:
                type: object
                required: [groups, coverage, page]
                properties:
                  groups:
                    type: array
                    items: { $ref: '#/components/schemas/JobGroup' }
                  coverage: { $ref: '#/components/schemas/JobCoverage' }
                  page: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
    post:
      operationId: putJobRule
      tags: [jobs]
      summary: Accept a job mapping rule (admin)
      description: |
        Lines with this code whose description has every one of `words` (empty: every line with the code) are
        `job`. The rule with the most words wins, a tie the newer. Adds the rule or replaces the one with the same
        code and words (as a set). `job` must be a parts.csv code or `ignore`, else 400. A new rule past 2000 in
        all, or 300 for its code, is 400 `too many rules`; changing a stored one is always allowed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRuleIn' }
            example: { im_code: LABOR, words: [FRONT, PADS], job: FBP }
      responses:
        '200':
          description: The rule as stored.
          content:
            application/json:
              schema:
                type: object
                required: [rule]
                properties:
                  rule: { $ref: '#/components/schemas/JobRule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }

  /api/job-map/rules:
    get:
      operationId: listJobRules
      tags: [jobs]
      summary: Every stored job mapping rule (admin)
      description: Read-only. Each rule once, by code then words, with who made it and when.
      responses:
        '200':
          description: All rules (at most 2000).
          content:
            application/json:
              schema:
                type: object
                required: [rules]
                properties:
                  rules:
                    type: array
                    items: { $ref: '#/components/schemas/JobRuleListed' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }

  /api/job-map/delete:
    post:
      operationId: deleteJobRule
      tags: [jobs]
      summary: Drop a job mapping rule (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobRuleKey' }
            example: { im_code: LABOR, words: [PADS, FRONT] }
      responses:
        '200':
          description: Whether there was such a rule.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }

  /api/price-suggestions:
    get:
      operationId: suggestPrices
      tags: [jobs]
      summary: Suggested part and labor prices for a job code and car (admin)
      description: |
        From the shop's own history: InvoMax lines mapped to the job plus our filled tickets (those tied to an
        InvoMax bill count once). The closest group of 3 or more, over the last 24 months and then all time:
        same model within 2 years, same model, same make, any car. With fewer than 3 samples anywhere, all of
        them answer. No history: the parts.csv price (`count` 0, basis `catalog`), or null. Dollars; `part` is
        per unit, `labor` is multiplied by `qty` (a qty below 1 counts as 1). The price can always be changed.
      parameters:
        - name: code
          in: query
          required: true
          description: A parts.csv job code (1 to 20 characters).
          schema: { type: string, minLength: 1, maxLength: 20, x-error: code must be 1 to 20 characters }
          example: FBP
        - name: year
          in: query
          description: The car's year, 1900 to 2100; leave out when unknown.
          schema: { type: string, pattern: '^[0-9]{1,4}$', x-error: year must be a whole number from 1900 to 2100 }
          example: '2019'
        - name: make
          in: query
          description: At most 40 characters.
          schema: { type: string, maxLength: 40, x-error: make must be at most 40 characters }
          example: Cadillac
        - name: model
          in: query
          description: At most 40 characters.
          schema: { type: string, maxLength: 40, x-error: model must be at most 40 characters }
          example: XT5
        - name: qty
          in: query
          description: More than 0 and at most 10000; 1 when left out.
          schema: { type: string, pattern: '^[0-9]+([.][0-9]+)?$', x-error: qty must be more than 0 and at most 10000 }
          example: '2'
      responses:
        '200':
          description: A suggestion for each of part and labor, or null.
          content:
            application/json:
              schema:
                type: object
                required: [part, labor]
                properties:
                  part:
                    oneOf: [{ $ref: '#/components/schemas/PriceSuggestion' }, { type: 'null' }]
                  labor:
                    oneOf: [{ $ref: '#/components/schemas/PriceSuggestion' }, { type: 'null' }]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }

  /api/own-bills/first-number:
    get:
      operationId: getFirstInvoiceNumber
      tags: [bills]
      summary: Whether our first invoice number is confirmed, and the number to propose (admin)
      description: |
        Own billing (404 while `ownBilling` is off in shop-settings.json). Until the first number is confirmed,
        it runs the InvoMax import first (when the import is on) and waits for it, so InvoMax's bills from this
        morning count: a failed import is 503 and proposes nothing. `proposed` is the highest number used + 1:
        InvoMax's 7-digit numbers on bills of the last 400 days, typed finals' and our own numbers, and the
        counter. Once confirmed, it only reports (`proposed` is the number the next bill gets).
      responses:
        '200':
          description: Confirmed or not, and the number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FirstNumber' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ImportFailed' }
    post:
      operationId: confirmFirstInvoiceNumber
      tags: [bills]
      summary: Confirm our first invoice number, once (admin)
      description: |
        Runs the InvoMax import first (when on), then refuses a number at or below the highest used (400).
        Already confirmed: 409. A failed import: 503, nothing confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FirstNumberIn' }
            example: { invoice_no: '9000003' }
      responses:
        '204': { description: Confirmed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Changed' }
        '503': { $ref: '#/components/responses/ImportFailed' }

  /api/tickets/{id}/bill:
    post:
      operationId: approveBill
      tags: [bills]
      summary: Approve & print - bill the ticket under the next invoice number (admin)
      description: |
        Own billing (404 while off). In one transaction: checks the version, takes the next number, saves the
        ticket as filled, stores the bill (its invoice_finals row, source `ours`, and revision 1's snapshot) and
        moves the counter. Before the first number is confirmed: 428. The ticket already has our bill: 409 with
        its `invoice_no`. Another version: 409 with the stored ticket, as the ticket routes. No mechanic, no
        line, or lines that won't bill: 400. Filled or deleted: 409.
      parameters:
        - $ref: '#/components/parameters/TicketId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Versioned' }
            example: { version: 5 }
      responses:
        '201':
          description: The bill as stored (money in dollars).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already billed (`invoice_no`, to reprint), changed on another device (`ticket`), or filled or deleted.
          content:
            application/json:
              schema:
                anyOf:
                  - { $ref: '#/components/schemas/AlreadyBilled' }
                  - { $ref: '#/components/schemas/Conflict' }
                  - { $ref: '#/components/schemas/Error' }
        '428':
          description: The first invoice number isn't confirmed yet (GET, then POST /api/own-bills/first-number).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/own-bills/{no}:
    get:
      operationId: getOwnBill
      tags: [bills]
      summary: Our bill's latest revision, its revisions and its ticket (admin)
      description: Own billing (404 while off). Not one of our bills, 404. Money in dollars.
      parameters:
        - $ref: '#/components/parameters/OwnBillNo'
      responses:
        '200':
          description: The latest snapshot (what a reprint prints), every revision's when and who, the ticket id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnBill' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/own-bills/{no}/fix:
    post:
      operationId: fixOwnBill
      tags: [bills]
      summary: Fix our bill - edit its ticket and store a new revision under the same number (admin)
      description: |
        Own billing (404 while off). `fields` are the ticket's, as POST /api/tickets/{id} takes them (the desk's
        rules; the filled ticket may change; it keeps a mechanic and a line); `version` is the ticket's. The new
        revision keeps revision 1's date and time; earlier revisions are never changed. Another version: 409
        with the stored ticket.
      parameters:
        - $ref: '#/components/parameters/OwnBillNo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BillFix' }
            example: { version: 6, fields: { notes: customer will wait } }
      responses:
        '200':
          description: The new revision (money in dollars).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BillSnapshot' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/SignIn' }
        '403': { $ref: '#/components/responses/NotAllowed' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: sid

  parameters:
    TicketId:
      name: id
      in: path
      required: true
      description: 1 to 9 digits; anything else is 404.
      schema: { type: integer, minimum: 0, maximum: 999999999 }
      example: 1
    BillKey:
      name: key
      in: path
      required: true
      description: |
        im<the InvoMax bill number, URI-encoded> (an InvoMax bill, odd numbers like 9000001A too; 1 to 40
        characters once decoded) or t<1 to 9 digits> (a ticket), as a row's `key` gives it; anything else is 404.
      schema: { type: string, pattern: '^(im.{1,120}|t[0-9]{1,9})$' }
      example: im9000001
    TicketKey:
      name: key
      in: path
      required: true
      description: t<ticket id, 1 to 9 digits>; anything else (an im key too) is 404.
      schema: { type: string, pattern: '^t[1-9][0-9]{0,8}$' }
      example: t2

    OwnBillNo:
      name: no
      in: path
      required: true
      description: Our invoice number (1 to 9 digits; anything else is 404).
      schema: { type: string, pattern: '^[0-9]{1,9}$' }
      example: '9000003'

  responses:
    BadRequest:
      description: |
        Bad input. Field-level problems from the ticket rules or the account rules carry `errors`
        (field -> message), which the pages show next to each field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SignIn:
      description: No live session.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotAllowed:
      description: The wrong role, someone else's job, or a POST from another site.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: No such ticket or user, or not one this caller may see.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: A deleted ticket this mechanic could see before it was deleted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: removed by the desk }
    Conflict:
      description: Changed on another device, or a move or edit not allowed now; `ticket` is the stored one.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Conflict' }
    BillNow:
      description: The ticket's row as it is now, as GET /api/invoices/{key} gives it.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Bill' }
    ImportFailed:
      description: The InvoMax import failed (or couldn't run), so no number is proposed or confirmed; try again.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Changed:
      description: Changed on another device (the link's version), or the bill is another ticket's.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: changed on another device }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, examples: ['sign in'] }
        errors:
          description: Field -> message, from the ticket or account rules.
          type: object
          additionalProperties: { type: string }
          examples: [{ phone: phone is required }]

    Conflict:
      type: object
      required: [error, ticket]
      properties:
        error: { type: string, examples: ['changed on another device'] }
        ticket: { $ref: '#/components/schemas/Ticket' }

    Me:
      type: object
      required: [role, name, id]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        name: { type: string }
        id: { type: [integer, 'null'] }

    Role:
      type: string
      enum: [admin, mechanic]

    Status:
      type: string
      enum: [waiting, working, review, approved, filled, deleted]

    LiveStatus:
      description: A status a move can reach; `deleted` is only reached by POST /api/tickets/{id}/delete.
      type: string
      enum: [waiting, working, review, approved, filled]

    Line:
      description: One invoice line. price null = labor only; labor null = no labor charge.
      type: object
      required: [desc, qty, price, labor, code, id]
      properties:
        desc: { type: string }
        qty: { type: number }
        price: { type: [number, 'null'] }
        labor: { type: [number, 'null'] }
        code: { type: string, description: The parts.csv code when matched. }
        id: { type: integer }

    Deposit:
      type: object
      required: [amount, method, date, note, id]
      properties:
        amount: { type: number }
        method: { $ref: '#/components/schemas/Method' }
        date: { type: string, description: YYYY-MM-DD }
        note: { type: string }
        id: { type: integer }

    Method:
      type: string
      enum: [cash, card, check, other]

    Totals:
      description: Money in dollars, rounded half-up to cents per line. `deposits` is the admin's only.
      type: object
      required: [parts, labor, total]
      properties:
        parts: { type: number }
        labor: { type: number }
        total: { type: number }
        deposits: { type: number }

    Ticket:
      description: |
        A ticket as the caller's role sees it. Admin: every field, deposits and totals.deposits. Mechanic: no
        `deposits` and no totals.deposits. `vin_warning` is worked out per reply, not stored. Stored rows keep
        keys this version doesn't know (written by Python), so a client must allow extra keys.
      type: object
      additionalProperties: true
      required:
        - id
        - status
        - first
        - last
        - phone
        - year
        - make
        - model
        - plate
        - request
        - mechanic
        - odometer
        - vin
        - notes
        - lines
        - back_note
        - mech_edit
        - created
        - updated
        - version
        - deleted_at
        - deleted_by
        - deleted_from
        - totals
        - vin_warning
      properties:
        id: { type: integer }
        status: { $ref: '#/components/schemas/Status' }
        first: { type: string }
        last: { type: string }
        phone: { type: string, examples: ['(555)010-0000'] }
        year: { type: string }
        make: { type: string }
        model: { type: string }
        plate: { type: string }
        request: { type: string }
        mechanic: { type: string, description: The mechanic account's name; '' = not assigned. }
        odometer: { type: string }
        vin: { type: string }
        notes: { type: string }
        lines:
          type: array
          items: { $ref: '#/components/schemas/Line' }
        deposits:
          description: Admin only.
          type: array
          items: { $ref: '#/components/schemas/Deposit' }
        back_note: { type: string, description: Why the desk sent it back. }
        mech_edit: { type: string, description: When a mechanic last changed the invoice; '' = never. }
        created: { type: string, description: 'Local time, YYYY-MM-DDTHH:MM:SS' }
        updated: { type: string, description: 'Local time, YYYY-MM-DDTHH:MM:SS' }
        version: { type: integer, description: Goes up by one on every save. }
        deleted_at: { type: string, description: "When it was deleted, as `updated`; '' = not deleted." }
        deleted_by: { type: string, description: "Who deleted it: role#id (admin#1, mechanic#3), never a name." }
        deleted_from:
          type: string
          description: "The status it was deleted from, which a restore puts back; '' = not deleted."
        totals: { $ref: '#/components/schemas/Totals' }
        vin_warning: { type: string, description: "'' when the VIN looks right or is empty." }

    ListedTicket:
      description: A ticket in a list. A deleted one (the admin asked for them) also says when the purge takes it.
      type: object
      allOf:
        - $ref: '#/components/schemas/Ticket'
      properties:
        purge_on:
          description: |
            YYYY-MM-DD, 14 days after it was deleted; null when it is kept until restored: deleted as an approved
            or filled invoice, or holding any deposit (the customer may come back when parts are delayed).
          type: [string, 'null']

    LineIn:
      description: A line as typed. Money may be a number or text ('$1,200.50'); a line without id is new.
      type: object
      required: [desc]
      properties:
        desc: { type: string }
        qty: { type: [number, string, 'null'] }
        price: { type: [number, string, 'null'] }
        labor: { type: [number, string, 'null'] }
        code: { type: string }
        id: { type: integer }

    DepositIn:
      description: A deposit as typed; method defaults to cash, date to today.
      type: object
      required: [amount]
      properties:
        amount: { type: [number, string] }
        method: { $ref: '#/components/schemas/Method' }
        date: { type: string }
        note: { type: string }
        id: { type: integer }

    CheckIn:
      description: What a mechanic's check-in keeps; every other key is dropped.
      x-checked-in: domain
      type: object
      required: [first, last, phone, year, make, model]
      properties:
        first: { type: string }
        last: { type: string }
        phone: { type: string, description: '10 digits, any punctuation.' }
        year: { type: string, description: 1950 to next year. }
        make: { type: string }
        model: { type: string }
        plate: { type: string }
        request: { type: string }
        token: { type: string, minLength: 8, maxLength: 64, description: One per new ticket on the page. }

    NewTicket:
      description: The desk's new ticket, the whole invoice at once if it likes. Unknown keys are ignored.
      x-checked-in: domain
      type: object
      required: [first, last, phone, year, make, model]
      properties:
        first: { type: string }
        last: { type: string }
        phone: { type: string }
        year: { type: string }
        make: { type: string }
        model: { type: string }
        plate: { type: string }
        request: { type: string }
        mechanic: { type: string, description: An active mechanic's name (any case); '' or none = not assigned. }
        odometer: { type: string }
        vin: { type: string }
        notes: { type: string }
        lines:
          type: array
          items: { $ref: '#/components/schemas/LineIn' }
        deposits:
          type: array
          items: { $ref: '#/components/schemas/DepositIn' }
        token: { type: string, minLength: 8, maxLength: 64 }

    Edit:
      description: The fields to change, and the version the device saw. Unknown keys (and `who`) are ignored.
      type: object
      required: [version]
      properties:
        version: { $ref: '#/components/schemas/Version' }
        first: { type: string, x-checked-in: domain }
        last: { type: string, x-checked-in: domain }
        phone: { type: string, x-checked-in: domain }
        year: { type: string, x-checked-in: domain }
        make: { type: string, x-checked-in: domain }
        model: { type: string, x-checked-in: domain }
        plate: { type: string, x-checked-in: domain }
        request: { type: string, x-checked-in: domain }
        mechanic: { type: string, x-checked-in: domain }
        odometer: { type: string, x-checked-in: domain }
        vin: { type: string, x-checked-in: domain }
        notes: { type: string, x-checked-in: domain }
        lines:
          x-checked-in: domain
          type: array
          items: { $ref: '#/components/schemas/LineIn' }
        deposits:
          x-checked-in: domain
          type: array
          items: { $ref: '#/components/schemas/DepositIn' }

    Move:
      type: object
      required: [version, to]
      properties:
        version: { $ref: '#/components/schemas/Version' }
        to: { x-checked-in: route, $ref: '#/components/schemas/LiveStatus' }
        note: { x-checked-in: route, type: [string, 'null'], maxLength: 2000, description: Needed to send it back. }
        mechanic: { x-checked-in: route, type: string, description: Who the desk accepts it for. }

    Versioned:
      description: Only the version the device saw.
      type: object
      required: [version]
      properties:
        version: { $ref: '#/components/schemas/Version' }

    Version:
      description: The ticket version the device saw.
      x-error: version must be a whole number
      type: integer
      minimum: -9007199254740991
      maximum: 9007199254740991

    NewUser:
      x-checked-in: domain
      type: object
      required: [name, role, secret]
      properties:
        name: { type: string, description: 'Cut to its first 80 characters, not refused.' }
        role: { $ref: '#/components/schemas/Role' }
        secret: { type: string, description: 'Admin: a password, 10 or more characters. Mechanic: a PIN of digits.' }

    UserChange:
      description: Either or both.
      x-checked-in: route
      type: object
      properties:
        secret: { type: string }
        active: { type: boolean }

    User:
      type: object
      required: [id, name, role, active, created]
      properties:
        id: { type: integer }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
        created: { type: string }

    Hint:
      type: object
      required: [code, description, part_price, labor_price]
      properties:
        code: { type: string, examples: [FBP] }
        description: { type: string, examples: [FRONT BRAKE PADS] }
        part_price: { type: number }
        labor_price: { type: number }

    Vehicles:
      description: Make -> model -> [first model year, last model year].
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: array
          items: { type: integer }

    Nothing:
      description: An empty JSON object (a POST must still send JSON).
      type: object

    Upkeep:
      type: object
      required: [backup, import, needs_bill, ownBilling]
      properties:
        backup:
          type: object
          required: [last, stale, invomax, offsite, offsite_stale, offsite_failed]
          properties:
            last: { type: [string, 'null'], description: The newest tickets backup's date (YYYY-MM-DD). }
            stale: { type: boolean, description: 'No tickets backup, or (with an invomax.db) no invomax one, from the last 2 days.' }
            invomax: { type: [string, 'null'], description: The newest invomax backup's date (YYYY-MM-DD). }
            offsite: { type: [string, 'null'], description: When the backups were last copied off this PC. }
            offsite_stale: { type: boolean, description: 'That copy is more than 7 days old, or the last copy failed.' }
            offsite_failed: { type: [string, 'null'], description: "The last copy's error class when it failed (Error ENOSPC), else null." }
        import:
          type: object
          required: [running, last, off]
          properties:
            running: { type: boolean }
            off: { type: boolean, description: 'shop-settings.json turns the import off ("invomaxDir": null).' }
            last:
              oneOf:
                - type: 'null'
                - $ref: '#/components/schemas/ImportRun'
        needs_bill: { type: integer }
        ownBilling: { type: boolean, description: "shop-settings.json turns the app's own billing on." }

    ImportRun:
      type: object
      required: [finished, ok, invoices]
      properties:
        finished: { type: string, description: 'Local time, YYYY-MM-DDTHH:MM:SS.' }
        ok: { type: boolean }
        invoices: { type: integer }

    CopyResult:
      type: object
      required: [copied, skipped, target]
      properties:
        copied: { type: integer }
        skipped: { type: integer, description: 'Already there: the same size and time.' }
        target: { type: string }

    BillRow:
      description: One row of Bill history. Money in dollars.
      type: object
      required: [key, date, invoice_no, ticket_id, name, phone, vehicle, plate, total]
      properties:
        key: { type: string, examples: [im9000001, im9000001A, t2], description: 'im + the bill number URI-encoded, or t + the ticket id.' }
        date: { type: string, description: "The bill's date, else the day the ticket was filled (YYYY-MM-DD)." }
        invoice_no: { type: [string, 'null'] }
        ticket_id: { type: [integer, 'null'] }
        name: { type: string }
        phone: { type: string, description: Digits. }
        vehicle: { type: string }
        plate: { type: string }
        total: { type: [number, 'null'], description: The bill's total; null for a ticket with no bill. }

    ImLine:
      description: A line of an InvoMax bill. Money in dollars.
      type: object
      required: [code, description, kind, qty, unit, amount]
      properties:
        code: { type: string }
        description: { type: string }
        kind: { type: string, enum: [part, labor, other] }
        qty: { type: number }
        unit: { type: number }
        amount: { type: number }

    BillCustomer:
      description: Who and what, from our ticket when there is one, else from InvoMax's bill.
      type: object
      required: [name, phone, vehicle, plate]
      properties:
        name: { type: string }
        phone: { type: string }
        vehicle: { type: string }
        plate: { type: string }

    BillBefore:
      description: Our ticket's side. Money in dollars.
      type: object
      required: [ticket_id, lines, parts, labor, subtotal]
      properties:
        ticket_id: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/Line' }
        parts: { type: number }
        labor: { type: number }
        subtotal: { type: number }

    BillAfter:
      description: The bill's side, InvoMax's, typed by the admin (no lines) or our own (the latest revision). Money in dollars.
      type: object
      required: [invoice_no, date, parts, labor, supplies, discount, deposit, tax, total, balance, lines, source, gone]
      properties:
        invoice_no: { type: [string, 'null'] }
        date: { type: string }
        parts: { type: number }
        labor: { type: number }
        supplies: { type: number }
        discount: { type: number }
        deposit: { type: number }
        tax: { type: number }
        total: { type: number }
        balance: { type: number }
        lines:
          type: array
          items: { $ref: '#/components/schemas/ImLine' }
        source: { type: string, enum: [invomax, typed, ours] }
        gone: { type: boolean, description: InvoMax no longer has this bill. }

    BillLink:
      type: object
      required: [source, linked_by, linked_at, version]
      properties:
        source: { type: string, enum: [invomax, typed, none, ours] }
        linked_by: { type: string, description: 'auto, or admin#<id>.' }
        linked_at: { type: string }
        version: { type: integer, description: 'What link, unlink, none and final send back.' }

    BillOwn:
      description: Our own bill's number and revisions.
      type: object
      required: [invoice_no, revisions, revised_at, revised_by]
      properties:
        invoice_no: { type: string }
        revisions: { type: integer, description: 1 until the bill is fixed. }
        revised_at: { type: [string, 'null'], description: When the latest fix was made; null with one revision. }
        revised_by: { type: [string, 'null'], description: 'Who made it (admin#<id>); null with one revision.' }

    Bill:
      description: Both sides of a row. `difference` is our subtotal less the bill's parts + labor, in dollars.
      type: object
      required: [key, customer, before, after, link, difference, own]
      properties:
        key: { type: string }
        customer: { $ref: '#/components/schemas/BillCustomer' }
        before:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BillBefore'
        after:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BillAfter'
        link:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BillLink'
        difference: { type: [number, 'null'] }
        own:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/BillOwn'

    Customer:
      type: object
      required: [phone, vehicles]
      properties:
        phone: { type: string }
        vehicles:
          type: array
          items: { $ref: '#/components/schemas/CustomerVehicle' }

    CustomerVehicle:
      type: object
      required: [plate, vin, vehicle, bills]
      properties:
        plate: { type: string }
        vin: { type: string }
        vehicle: { type: string }
        bills:
          type: array
          items: { $ref: '#/components/schemas/BillRow' }

    Candidate:
      type: object
      required: [invoice_no, date, name, plate, total, why]
      properties:
        invoice_no: { type: string }
        date: { type: string }
        name: { type: string }
        plate: { type: string }
        total: { type: number, description: Dollars. }
        why: { type: string, enum: [plate, phone] }

    NeedsBill:
      type: object
      required: [ticket_id, name, vehicle, plate, filled, subtotal, candidates]
      properties:
        ticket_id: { type: integer }
        name: { type: string }
        vehicle: { type: string }
        plate: { type: string }
        filled: { type: string, description: The day it was filled (YYYY-MM-DD). }
        subtotal: { type: number, description: 'Parts + labor on the ticket, in dollars.' }
        candidates:
          type: array
          items: { $ref: '#/components/schemas/Candidate' }

    LinkVersion:
      description: The link's version as GET /api/invoices/{key} gave it (link.version); null when there was none.
      x-error: version must be null or a whole number
      type: [integer, 'null']
      minimum: 0
      maximum: 9007199254740991

    InvoiceNo:
      x-error: invoice_no must be 1 to 7 digits
      type: string
      pattern: '^[0-9]{1,7}$'

    LinkIn:
      type: object
      required: [invoice_no, version]
      properties:
        invoice_no: { $ref: '#/components/schemas/InvoiceNo' }
        version: { $ref: '#/components/schemas/LinkVersion' }

    LinkVersioned:
      type: object
      required: [version]
      properties:
        version: { $ref: '#/components/schemas/LinkVersion' }

    Dollars:
      description: Dollars to the cent, 0 to 1,000,000.
      x-error: money must be dollars, 0 to 1000000
      type: number
      minimum: 0
      maximum: 1000000

    FinalIn:
      description: InvoMax's bill as typed by the admin. total = parts + labor + supplies + tax (no discount).
      type: object
      required: [parts, labor, supplies, tax, total, version]
      properties:
        invoice_no: { $ref: '#/components/schemas/InvoiceNo' }
        parts: { $ref: '#/components/schemas/Dollars' }
        labor: { $ref: '#/components/schemas/Dollars' }
        supplies: { $ref: '#/components/schemas/Dollars' }
        tax: { $ref: '#/components/schemas/Dollars' }
        total: { $ref: '#/components/schemas/Dollars' }
        version: { $ref: '#/components/schemas/LinkVersion' }

    ImCode:
      description: An InvoMax line code (FBP, LABOR, INSTALL-).
      x-error: im_code must be 1 to 8 characters
      type: string
      minLength: 1
      maxLength: 8

    JobWords:
      description: |
        Description words, upper-case letters and digits, each with a letter (as normalised); compared as a set.
        A LABOR or INSTALL- rule needs at least one (the route says so); another code's rule may have none.
      x-error: words must be up to 10 upper-case letters-and-digits words, each with a letter
      type: array
      maxItems: 10
      items: { type: string, maxLength: 40, pattern: '^[A-Z0-9]*[A-Z][A-Z0-9]*$' }

    JobRuleKey:
      type: object
      required: [im_code, words]
      properties:
        im_code: { $ref: '#/components/schemas/ImCode' }
        words: { $ref: '#/components/schemas/JobWords' }

    JobRuleIn:
      type: object
      required: [im_code, words, job]
      properties:
        im_code: { $ref: '#/components/schemas/ImCode' }
        words: { $ref: '#/components/schemas/JobWords' }
        job: { type: string, description: 'A parts.csv code, or ignore.', x-checked-in: route }

    JobRule:
      type: object
      required: [id, im_code, words, job, made_by, made_at]
      properties:
        id: { type: integer }
        im_code: { type: string }
        words:
          type: array
          items: { type: string }
          description: Each once, sorted.
        job: { type: string }
        made_by: { type: string, examples: ['admin#1'] }
        made_at: { type: string, description: 'Local time, YYYY-MM-DDTHH:MM:SS.' }

    PriceSuggestion:
      type: object
      required: [price, count, low, high, basis]
      properties:
        price: { type: number, description: 'Dollars, to the cent.' }
        count: { type: integer, description: 'How many past lines it rests on; 0 for the catalog price.' }
        low: { type: number, description: 'The 25th percentile, dollars.' }
        high: { type: number, description: 'The 75th percentile, dollars.' }
        basis:
          oneOf:
            - $ref: '#/components/schemas/PriceBasis'
            - type: object
              required: [level]
              properties:
                level: { type: string, enum: [catalog] }

    PriceBasis:
      type: object
      required: [level, years, make, model, recent]
      properties:
        level: { type: string, enum: [model_years, model, make, all] }
        years:
          oneOf:
            - type: array
              items: { type: integer }
              minItems: 2
              maxItems: 2
            - type: 'null'
        make: { type: string }
        model: { type: string }
        recent: { type: boolean, description: 'Over the last 24 months; false is all time.' }

    JobRuleListed:
      type: object
      required: [im_code, words, job, made_by, made_at]
      properties:
        im_code: { type: string }
        words:
          type: array
          items: { type: string }
          description: Each once, sorted.
        job: { type: string }
        made_by: { type: string, examples: ['admin#1'] }
        made_at: { type: string, description: 'Local time, YYYY-MM-DDTHH:MM:SS.' }

    JobPick:
      type: object
      required: [job, words]
      properties:
        job: { type: string }
        words:
          type: array
          items: { type: string }

    JobGroup:
      type: object
      required: [im_code, words, lines, dollars, samples, proposed, rule]
      properties:
        im_code: { type: string }
        words:
          description: The description's words for a generic code's group; [] for any other code.
          type: array
          items: { type: string }
        lines: { type: integer }
        dollars: { type: number }
        samples:
          description: Up to 3 descriptions, the most frequent first.
          type: array
          items: { type: string }
        proposed:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JobPick'
        rule:
          description: The rule that maps the group's code and words, if any.
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JobPick'

    JobCoverage:
      description: Part and labor lines on bills InvoMax still has; mapped means a rule (ignore too) maps it.
      type: object
      required: [lines, mapped_lines, dollars, mapped_dollars]
      properties:
        lines: { type: integer }
        mapped_lines: { type: integer }
        dollars: { type: number }
        mapped_dollars: { type: number }

    FirstNumber:
      type: object
      required: [confirmed, proposed]
      properties:
        confirmed: { type: boolean }
        proposed: { type: string, pattern: '^[0-9]+$', examples: ['9000006'] }

    FirstNumberIn:
      type: object
      required: [invoice_no]
      properties:
        invoice_no:
          description: 7 digits, above the highest number used.
          x-error: invoice_no must be 7 digits
          type: string
          pattern: '^[1-9][0-9]{6}$'

    BillFix:
      type: object
      required: [version, fields]
      properties:
        version: { $ref: '#/components/schemas/Version' }
        fields:
          description: The ticket's fields to change, as Edit's (without `version`).
          x-checked-in: route
          type: object

    AlreadyBilled:
      type: object
      required: [error, invoice_no]
      properties:
        error: { type: string, examples: ['already billed as #9000006'] }
        invoice_no: { type: string }

    BillAmounts:
      description: Dollars. supplies = 5% of parts + labor, at most 20.00; tax = 6% of parts + supplies; balance = total - deposit.
      type: object
      required: [parts, labor, supplies, tax, total, deposit, balance]
      properties:
        parts: { type: number }
        labor: { type: number }
        supplies: { type: number }
        tax: { type: number }
        total: { type: number }
        deposit: { type: number }
        balance: { type: number }

    LaborRow:
      type: object
      required: [desc, amount]
      properties:
        desc: { type: string, description: 'A line with a part too reads "Remove & Install: <desc>".' }
        amount: { type: number }

    PartRow:
      type: object
      required: [desc, qty, price, total]
      properties:
        desc: { type: string }
        qty: { type: number }
        price: { type: number, description: Each. }
        total: { type: number }

    ShopInfo:
      type: object
      required: [name, address, phone, hours]
      properties:
        name: { type: string }
        address: { type: array, items: { type: string } }
        phone: { type: string }
        hours: { type: string }

    BillSnapshot:
      description: Everything our bill prints, as stored for one revision (money in dollars).
      type: object
      required: [invoice_no, revision, date, time, customer, vehicle, mechanic, labor, parts, amounts, shop]
      properties:
        invoice_no: { type: string }
        revision: { type: integer, minimum: 1 }
        date: { type: string, description: 'YYYY-MM-DD, local: first approved (every revision keeps it).' }
        time: { type: string, description: 'HH:MM, 24 h, local: first approved.' }
        customer:
          type: object
          required: [first, last, phone]
          properties:
            first: { type: string }
            last: { type: string }
            phone: { type: string }
        vehicle:
          type: object
          required: [year, make, model, plate, vin, odometer]
          properties:
            year: { type: string }
            make: { type: string }
            model: { type: string }
            plate: { type: string }
            vin: { type: string }
            odometer: { type: string }
        mechanic: { type: string }
        labor: { type: array, items: { $ref: '#/components/schemas/LaborRow' } }
        parts: { type: array, items: { $ref: '#/components/schemas/PartRow' } }
        amounts: { $ref: '#/components/schemas/BillAmounts' }
        shop: { $ref: '#/components/schemas/ShopInfo' }

    OwnBill:
      type: object
      required: [bill, revisions, ticket_id]
      properties:
        bill: { $ref: '#/components/schemas/BillSnapshot' }
        revisions:
          type: array
          items:
            type: object
            required: [revision, at, by]
            properties:
              revision: { type: integer, minimum: 1 }
              at: { type: string, description: 'YYYY-MM-DDTHH:MM:SS, local.' }
              by: { type: string, description: 'admin#<user id>' }
        ticket_id: { type: integer }
