<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Shop tickets</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{font:17px system-ui,-apple-system,sans-serif;margin:0;background:#f4f4f4;color:#222;-webkit-text-size-adjust:100%}
button{font:inherit;min-height:48px;padding:10px 18px;border:0;border-radius:8px;background:#1f5fbf;color:#fff;cursor:pointer}
button.light{background:#ddd;color:#222}
button.warn{background:#a35a00}
button.go{background:#1d7a34}
button:disabled{opacity:.5}
input,textarea,select{font:inherit;font-size:17px;width:100%;min-height:48px;padding:10px;border:1px solid #bbb;border-radius:8px;background:#fff;color:#222}
input[readonly],textarea[readonly]{background:#eee;border-color:#ddd}
textarea{min-height:80px;resize:vertical}
label{display:block;font-size:14px;color:#555;margin-bottom:4px}
header{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#fff;box-shadow:0 1px 4px #0002}
header h1{font-size:22px;margin:0;flex:1}
#net{font-size:14px;color:#777}
#net.bad{color:#b00;font-weight:600}
main{padding:12px 16px 40px}
.msg{padding:12px 14px;border-radius:8px;margin:0 0 12px}
.msg.err{background:#fde2e2;color:#800}
.msg.ok{background:#e0f2e4;color:#145a26}
.msg.note{background:#fff3b0;color:#4a3a00}
.msg.banner{background:#fff3b0;color:#4a3a00;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.msg.banner span{flex:1}
.msg ul{margin:6px 0;padding-left:22px}
.msg li{overflow-wrap:anywhere;white-space:pre-wrap}
/* board */
#board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:700px){#board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{background:#e6e6e6;border-radius:10px;padding:8px;min-height:120px}
.col h2{font-size:17px;margin:4px 4px 8px;display:flex;justify-content:space-between}
.col.review{background:#f3e7b0}
.card{display:block;width:100%;text-align:left;background:#fff;color:#222;border-radius:10px;padding:12px;margin:0 0 8px;min-height:64px;border:2px solid transparent;box-shadow:0 1px 2px #0001}
.card .name{font-weight:600;display:block;overflow-wrap:anywhere}
.card .car{display:block;font-size:15px;color:#555;overflow-wrap:anywhere}
.card .meta{display:block;margin-top:4px;overflow-wrap:anywhere}
.card.review{background:#fff3b0;border-color:#c99a00}
.card.back{border-left:6px solid #a35a00}
.meta{font-size:15px;color:#777}
.empty{color:#888;font-size:15px;padding:8px 4px}
/* forms */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px}
.grid .wide{grid-column:1/-1}
.ferr{color:#b00;font-size:14px;margin-top:4px}
.box{background:#fff;border-radius:10px;padding:14px;margin:0 0 14px}
.box h2{font-size:19px;margin:0 0 10px}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.actions .spacer{flex:1}
#saved{color:#145a26;font-weight:600}
.status{display:inline-block;padding:4px 10px;border-radius:12px;background:#ddd;font-size:15px;margin-left:8px;vertical-align:middle}
.status.review{background:#fff3b0}
.status.approved{background:#e0f2e4}
/* lines */
table{width:100%;border-collapse:collapse}
th{font-size:14px;color:#555;text-align:left;font-weight:600;padding:6px 4px}
td{padding:4px;vertical-align:middle}
td.num,th.num{text-align:right;white-space:nowrap}
td input{min-width:0}
col.c-qty{width:80px}
col.c-money{width:110px}
col.c-total{width:100px}
col.c-del{width:56px}
td .x{min-width:48px;padding:10px;background:#eee;color:#900}
td .code{display:block;font-size:13px;color:#666;margin-top:2px}
.totals{display:flex;gap:20px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px;font-size:18px}
.totals b{font-size:20px}
.deps td{border-bottom:1px solid #eee;padding:8px 4px}
.deps td.note{overflow-wrap:anywhere}
.dep-add{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end;margin-top:10px}
.ro{white-space:pre-wrap;overflow-wrap:anywhere}
.ready{font-size:22px;font-weight:600;color:#145a26}
/* signed in */
#me{font-size:14px;color:#555;overflow-wrap:anywhere}
#logoutForm{margin:0}
/* mechanics & admins */
.users td,.users th{padding:8px 6px;border-bottom:1px solid #eee}
.users td{overflow-wrap:break-word}
.users td.c-name{overflow-wrap:anywhere}
.users .role-inline{display:none;font-size:14px;color:#666}
input.pin{-webkit-text-security:disc}
.users .btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.users .btns button{min-height:44px;padding:8px 12px;font-size:15px}
.users tr.off td:not(:last-child){color:#999}
.you{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:10px;background:#dbe7fb;color:#1f3f7a;font-size:13px}
.onoff{display:inline-block;padding:2px 10px;border-radius:10px;font-size:14px;background:#e0f2e4;color:#145a26}
.onoff.no{background:#eee;color:#777}
.hint{font-size:14px;color:#666;margin-top:4px}
@media (max-width:640px){.users .c-created,.users .c-role{display:none}.users .role-inline{display:block}}
</style></head><body>
<header>
 <h1 id="title">Desk</h1>
 <span id="net" role="status" aria-live="polite"></span>
 <span id="me"></span>
 <button type="button" id="btnNew">New ticket</button>
 <button type="button" id="btnUsers" class="light">Mechanics &amp; admins</button>
 <button type="button" id="btnBoard" class="light" hidden>Back to board</button>
 <form id="logoutForm" method="post" action="/logout"><button type="submit" class="light">Sign out</button></form>
</header>
<main>
 <div id="flash" class="msg" role="status" aria-live="polite" hidden></div>

 <section id="viewBoard">
  <div id="board"></div>
 </section>

 <section id="viewNew" hidden>
  <div class="box">
   <h2>New ticket</h2>
   <div id="newErr" class="msg err" role="status" aria-live="polite" hidden></div>
   <form id="newForm" autocomplete="off" novalidate>
    <div class="grid">
     <div><label for="n-first">First name</label><input id="n-first" name="first" autocapitalize="characters" autocorrect="off" spellcheck="false"><div class="ferr" data-for="first"></div></div>
     <div><label for="n-last">Last name</label><input id="n-last" name="last" autocapitalize="characters" autocorrect="off" spellcheck="false"><div class="ferr" data-for="last"></div></div>
     <div><label for="n-phone">Phone</label><input id="n-phone" name="phone" type="tel" inputmode="tel"><div class="ferr" data-for="phone"></div></div>
     <div><label for="n-year">Year</label><input id="n-year" name="year" inputmode="numeric" maxlength="4" list="year-list"><div class="ferr" data-for="year"></div></div>
     <div><label for="n-make">Make</label><input id="n-make" name="make" autocapitalize="characters" autocorrect="off" spellcheck="false" list="make-list"><div class="ferr" data-for="make"></div></div>
     <div><label for="n-model">Model</label><input id="n-model" name="model" autocapitalize="characters" autocorrect="off" spellcheck="false" list="model-list"><div class="ferr" data-for="model"></div></div>
     <div><label for="n-plate">Plate (optional)</label><input id="n-plate" name="plate" autocapitalize="characters" autocorrect="off" spellcheck="false"><div class="ferr" data-for="plate"></div></div>
     <div class="wide"><label for="n-request">What the customer wants done</label><textarea id="n-request" name="request"></textarea><div class="ferr" data-for="request"></div></div>
    </div>
    <div class="actions"><button type="submit" id="btnCreate">Save ticket</button><button type="button" class="light" id="btnCancelNew">Cancel</button></div>
   </form>
  </div>
 </section>

 <section id="viewTicket" hidden></section>

 <section id="viewUsers" hidden>
  <div class="box">
   <h2>Mechanics &amp; admins</h2>
   <div id="uErr" class="msg err" role="status" aria-live="polite" hidden></div>
   <div id="uOk" class="msg ok" role="status" aria-live="polite" hidden></div>
   <table class="users">
    <thead><tr><th>Name</th><th class="c-role">Role</th><th>Account</th><th class="c-created">Added</th><th></th></tr></thead>
    <tbody id="uList"></tbody>
   </table>
  </div>

  <div class="box" id="resetBox" hidden>
   <h2 id="resetTitle">Reset PIN</h2>
   <div id="resetWarn" class="msg note" hidden></div>
   <div id="resetErr" class="msg err" role="status" aria-live="polite" hidden></div>
   <form id="resetForm" autocomplete="off" novalidate>
    <div class="grid">
     <div><label for="r-secret" id="r-label">New PIN</label><input id="r-secret" name="secret" type="text" class="pin" autocomplete="off" inputmode="numeric"><div class="hint" id="r-hint"></div><div class="ferr" data-for="secret"></div></div>
     <div><label for="r-again" id="r-label2">Same PIN again</label><input id="r-again" name="again" type="text" class="pin" autocomplete="off" inputmode="numeric"><div class="ferr" data-for="again"></div></div>
    </div>
    <div class="actions"><button type="submit" id="btnReset">Save</button><button type="button" class="light" id="btnCancelReset">Cancel</button></div>
   </form>
  </div>

  <div class="box">
   <h2>Add a mechanic or admin</h2>
   <div id="addErr" class="msg err" role="status" aria-live="polite" hidden></div>
   <form id="addForm" autocomplete="off" novalidate>
    <div class="grid">
     <div><label for="a-name">Name</label><input id="a-name" name="name" autocapitalize="words" autocorrect="off" spellcheck="false" maxlength="40"><div class="ferr" data-for="name"></div></div>
     <div><label for="a-role">Role</label><select id="a-role" name="role"><option value="mechanic">Mechanic</option><option value="admin">Admin</option></select><div class="ferr" data-for="role"></div></div>
     <div><label for="a-secret" id="a-label">PIN</label><input id="a-secret" name="secret" type="text" class="pin" autocomplete="off" inputmode="numeric"><div class="hint" id="a-hint"></div><div class="ferr" data-for="secret"></div></div>
     <div><label for="a-again" id="a-label2">Same PIN again</label><input id="a-again" name="again" type="text" class="pin" autocomplete="off" inputmode="numeric"><div class="ferr" data-for="again"></div></div>
    </div>
    <div class="actions"><button type="submit" id="btnAdd">Add</button></div>
   </form>
  </div>

  <div class="box">
   <h2>Check-in iPad</h2>
   <p class="meta">Customers check themselves in on an iPad set up here. It can only create new tickets — it sees nothing else.</p>
   <div id="kErr" class="msg err" role="status" aria-live="polite" hidden></div>
   <div id="kOk" class="msg ok" role="status" aria-live="polite" hidden></div>
   <div class="actions">
    <button type="button" id="btnKiosk">Use this iPad for check-in</button>
    <button type="button" class="warn" id="btnRevoke">Sign out all check-in iPads</button>
   </div>
  </div>
 </section>
</main>
<datalist id="year-list"></datalist>
<datalist id="make-list"></datalist>
<datalist id="model-list"></datalist>
<script>
"use strict";
const POLL_MS = 4000, AGE_MS = 60000, TIMEOUT_MS = 15000;
const OFFLINE = "Couldn't reach the shop PC — check the connection and try again.";
const BOARD = ["waiting", "working", "review", "approved"];
const COL_NAMES = {waiting: "Waiting", working: "Working", review: "Review", approved: "Approved"};
const NAMEISH = {autocapitalize: "characters", autocorrect: "off", spellcheck: "false"};
const FIELDS = [  // [key, label, extra attributes]; mechanic is handled apart (a list in review)
  ["first", "First name", NAMEISH],
  ["last", "Last name", NAMEISH],
  ["phone", "Phone", {type: "tel", inputMode: "tel"}],
  ["year", "Year", {inputMode: "numeric", maxLength: 4, list: "year-list"}],
  ["make", "Make", {...NAMEISH, list: "make-list"}],
  ["model", "Model", {...NAMEISH, list: "model-list"}],
  ["plate", "Plate", NAMEISH],
  ["odometer", "Odometer", {inputMode: "numeric"}],
];
const TEXTS = [["request", "What the customer wants done"], ["notes", "Notes"]];
const LABELS = Object.fromEntries([...FIELDS, ...TEXTS, ["mechanic", "Mechanic"]].map(([k, l]) => [k, l]));

const S = {
  tickets: [], etag: "", view: "board",
  cur: null,        // the open ticket as the server last sent it
  dirty: false,     // the desk changed something on the open ticket and hasn't saved
  newer: null,      // a newer server copy of the open ticket held back while editing
  mechanics: [],    // from /api/mechanics
  busy: false,
  polling: false,   // one poll at a time
  openSeq: 0,       // only the latest tap on a card opens a ticket
  authLost: false,  // a 401 came while the desk had typing on screen
  me: null,         // {role, name, id} from /api/me
  users: [],        // from /api/users
  resetting: null,  // the user whose PIN/password the reset box is for
};

const $ = id => document.getElementById(id);

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "for") e.htmlFor = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (["list", "autocapitalize", "autocorrect", "spellcheck"].includes(k) || k.includes("-")) e.setAttribute(k, v);
    else e[k] = v;
  }
  for (const c of kids.flat()) if (c != null) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
}

/* ---------- money in integer cents, rounded half-up like tickets.py ---------- */

// "12.345" / "$1,200" / 3 -> whole hundredths (half-up), null for blank, NaN for bad or negative
function hundredths(v) {
  const s = String(v ?? "").replace(/[$,\s]/g, "");
  if (s === "") return null;
  const m = /^([0-9]*)(?:\.([0-9]*))?$/.exec(s);
  if (!m || (m[1] === "" && !m[2])) return NaN;
  const f = (m[2] || "") + "000";
  return Number(m[1] || 0) * 100 + Number(f.slice(0, 2)) + (f[2] >= "5" ? 1 : 0);
}

function centsText(c) {
  if (!Number.isFinite(c)) return "—";
  const d = String(Math.floor(c / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
  return "$" + d + "." + String(c % 100).padStart(2, "0");
}

function money(n) { return centsText(hundredths(Number(n || 0).toFixed(2))); }

// one line -> {parts, labor} in cents, NaN when something typed isn't a number
function lineCents(qty, price, labor) {
  let q = hundredths(qty), p = hundredths(price), l = hundredths(labor);
  if (q === null) q = 100;  // blank qty is 1, as on the server
  if (Number.isNaN(q) || q === 0) return {parts: NaN, labor: NaN};
  const parts = p === null ? 0 : Number.isNaN(p) ? NaN : Math.floor((q * p + 50) / 100);  // qty x price, half-up
  return {parts, labor: l === null ? 0 : l};
}

function age(iso) {
  const t = new Date(iso).getTime();
  if (!isFinite(t)) return "";
  const m = Math.max(0, Math.floor((Date.now() - t) / 60000));
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " h " + (m % 60) + " min";
  const d = Math.floor(h / 24);
  return d + (d === 1 ? " day" : " days");
}

function squash(s) { return String(s ?? "").trim().split(/\s+/).join(" ").toUpperCase(); }
function fullName(t) { return [t.first, t.last].filter(Boolean).join(" "); }
function vehicle(t) { return [t.year, t.make, t.model].filter(Boolean).join(" "); }

function flash(text, kind) {
  const f = $("flash");
  f.textContent = text || "";
  f.className = "msg " + (kind || "err");
  f.hidden = !text;
  if (text) window.scrollTo(0, 0);
}

function setNet(ok, text) {
  const n = $("net");
  n.textContent = text || "";
  n.className = ok ? "" : "bad";
}

/* ---------- server calls ---------- */

class Http extends Error {
  constructor(status, data) { super((data && data.error) || ("error " + status)); this.status = status; this.data = data || {}; }
}

function formTyped(f) { return [...f.elements].some(e => (e.tagName === "INPUT" || e.tagName === "TEXTAREA") && e.value.trim()); }
function newFormTyped() { return formTyped($("newForm")); }
function hasTyping() {
  return S.dirty || (S.view === "ticket" && depTyped()) || (S.view === "new" && newFormTyped()) ||
         (S.view === "users" && (formTyped($("addForm")) || (!$("resetBox").hidden && formTyped($("resetForm")))));
}

function on401() {  // session gone: the reload shows the sign-in page, unless that would lose typing
  if (!hasTyping()) { location.reload(); return; }
  if (!S.authLost) flash("You were signed out. Copy what you typed somewhere, then reload this page to sign in again.");
  S.authLost = true;
  setNet(false, "Sign-in needed — reload when ready");
}

function timeoutSignal() {
  if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) return AbortSignal.timeout(TIMEOUT_MS);
  const c = new AbortController();
  setTimeout(() => c.abort(), TIMEOUT_MS);
  return c.signal;
}

async function api(method, path, body, headers) {
  const opt = {method, headers: {...(headers || {})}, cache: "no-store", signal: timeoutSignal()};
  if (body !== undefined) {
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
  }
  let r, data;
  try {
    r = await fetch(path, opt);
    if (r.status === 304) return {status: 304, data: null, etag: r.headers.get("ETag")};
    const raw = await r.text();
    try { data = JSON.parse(raw); } catch (e) { data = undefined; }
  } catch (e) {  // offline, timed out, dropped
    throw new Http(0, {error: OFFLINE});
  }
  if (r.status === 401) { on401(); throw new Http(401, {error: "Sign-in needed"}); }
  if (r.status === 403) throw new Http(403, {error: "Not allowed — this account can't do that."});
  if (data === undefined || data === null || typeof data !== "object") {
    throw new Http(r.status, {error: r.ok ? "Unexpected reply from the server" : "Server error (" + r.status + ")"});
  }
  if (!r.ok) throw new Http(r.status, data);
  return {status: r.status, data, etag: r.headers.get("ETag")};
}

async function loadMechanics() {
  try {
    const r = await api("GET", "/api/mechanics");
    if (Array.isArray(r.data.mechanics)) S.mechanics = r.data.mechanics.map(String);
  } catch (e) { /* keep the last list; the select still holds the current name */ }
}

/* ---------- year / make / model lists (vehicles.json) ---------- */

const FIRST_YEAR = 1990, NEXT_YEAR = new Date().getFullYear() + 1;
let CARS = {}, modelsShown = null, carsLoading = false;  // {"MAKE": {"MODEL": [first, last]}}; the make|year listed
const MAKE_ALIAS = {CHEVY: "CHEVROLET", VW: "VOLKSWAGEN", MERCEDES: "MERCEDES-BENZ", BENZ: "MERCEDES-BENZ",
                    "MERCEDES BENZ": "MERCEDES-BENZ", LANDROVER: "LAND ROVER"};

function fillList(id, items) { $(id).replaceChildren(...items.map(v => el("option", {value: v}))); }

async function loadVehicles() {  // at start, and again from poll() while empty; until then typing still works
  if (carsLoading) return;
  carsLoading = true;
  try {
    const d = (await api("GET", "/api/vehicles")).data;
    if (!Array.isArray(d)) { CARS = d; fillList("make-list", Object.keys(d)); modelsShown = null; }
  } catch (e) { /* free text only */ } finally { carsLoading = false; }
}

function refreshModels(root) {  // models of the make typed in this form; of the typed year when it has any
  const val = n => (root.querySelector('[name="' + n + '"]') || {}).value;
  const make = MAKE_ALIAS[squash(val("make"))] || squash(val("make")), y = Number(val("year"));
  const year = /^[0-9]{4}$/.test(String(val("year")).trim()) && y >= FIRST_YEAR && y <= NEXT_YEAR ? y : 0;
  if (modelsShown === make + "|" + year) return;
  modelsShown = make + "|" + year;
  const models = Object.entries(CARS[make] || {});
  const built = models.filter(([, r]) => Array.isArray(r) && r[0] <= year && year <= r[1]);
  fillList("model-list", (year && built.length ? built : models).map(([m]) => m));  // none that year: all of them
}

function carField(ev) {
  const root = ev.target.closest && ev.target.closest("#newForm, #viewTicket");
  if (root && ["year", "make", "model"].includes(ev.target.name)) refreshModels(root);
}

/* ---------- views ---------- */

function show(view) {
  S.view = view;
  $("viewBoard").hidden = view !== "board";
  $("viewNew").hidden = view !== "new";
  $("viewTicket").hidden = view !== "ticket";
  $("viewUsers").hidden = view !== "users";
  $("btnNew").hidden = view !== "board";
  $("btnUsers").hidden = view !== "board";
  $("btnBoard").hidden = view === "board";
  if (view !== "ticket") $("title").textContent = {new: "New ticket", users: "Mechanics & admins"}[view] || "Desk";
  window.scrollTo(0, 0);
}

function leaveTicket() {
  if (S.view === "ticket" && (S.dirty || depTyped()) && !confirm("Leave without saving your changes?")) return;
  S.cur = null; S.dirty = false; S.newer = null;
  flash("");
  show("board");
}

function leaveNew() {
  if (newFormTyped() && !confirm("Throw away this new ticket?")) return;
  $("newForm").reset();
  clearNewErrors();
  flash("");
  show("board");
}

/* ---------- board ---------- */

function renderBoard() {
  const cols = BOARD.map(st => {
    const list = S.tickets.filter(t => t.status === st);
    const col = el("div", {class: "col " + st},
      el("h2", {}, el("span", {text: COL_NAMES[st]}), el("span", {text: String(list.length)})));
    if (!list.length) col.append(el("div", {class: "empty", text: "None"}));
    for (const t of list) {
      const meta = el("span", {class: "meta"});
      meta.dataset.mechanic = t.mechanic || "";
      meta.dataset.created = t.created || "";
      col.append(el("button", {type: "button", class: "card " + st + (t.back_note && st === "working" ? " back" : ""),
                               onclick: () => openTicket(t.id)},
        el("span", {class: "name", text: fullName(t) || "(no name)"}),
        el("span", {class: "car", text: vehicle(t)}),
        meta));
    }
    return col;
  });

    m.textContent = [m.dataset.mechanic, age(m.dataset.created)].filter(Boolean).join(" · ");
  }

async function poll() {
  if (S.polling || document.hidden) return;
  S.polling = true;
  try {
    const r = await api("GET", "/api/tickets?status=" + BOARD.join(","), undefined,
                        S.etag ? {"If-None-Match": S.etag} : {});
    const changed = r.status !== 304;
    if (changed) {
      if (!Array.isArray(r.data.tickets)) throw new Http(200, {error: "Unexpected reply from the server"});
      S.tickets = r.data.tickets;
      S.etag = r.etag || "";
      renderBoard();
    }
    if (!S.authLost) setNet(true, "");
    if (!Object.keys(CARS).length) loadVehicles();  // the first try failed (or the list is missing): try again
    if (S.view === "ticket" && S.cur) await syncOpen(changed);
  } catch (e) {
    if (e.status !== 401) setNet(false, e.message.replace(/\.$/, "") + " — retrying…");
  } finally {
    S.polling = false;
  }
}

function isField(e) { return e && (e.tagName === "INPUT" || e.tagName === "TEXTAREA" || e.tagName === "SELECT") && !e.readOnly; }
function editingNow() {
  return S.dirty || depTyped() || ($("viewTicket").contains(document.activeElement) && isField(document.activeElement));
}

async function syncOpen(changed) {
  const cur = S.cur;
  if (cur.status === "filled") return;  // done: nothing more will change
  if (changed) {
    let t = S.tickets.find(x => x.id === cur.id);
    if (!t) {  // left the board (filled on another device)
      try { t = (await api("GET", "/api/tickets/" + cur.id)).data; } catch (e) { return; }
    }
    if (S.cur !== cur) return;  // the desk moved on meanwhile
    if (t && t.version > cur.version && (!S.newer || t.version > S.newer.version)) S.newer = t;
  }
  if (!S.newer) return;
  if (editingNow()) renderBanner();  // never overwrite what the desk is typing
  else {
    const was = S.cur;
    loadTicket(S.newer);
    if (was.status === "approved" && S.cur.status === "approved" && S.cur.totals?.total !== was.totals?.total)
      tError("Prices changed on another device — check InvoMax has the same.");
  }
}

// The add-deposit form: {amount, method, date, note} as typed, or null when there's no form.

// change(deposits) -> the list to store. The desk's unsaved typing on an editable ticket goes in the same save;
// deposits alone that meet a newer copy (a mechanic's line, say) go again once on it. Returns {t, withEdits} or null.
async function saveDeposits(change) {
  const t = S.cur, withEdits = S.dirty && editable(t);

  clearTicketErrors();

    withEdits ? null : fresh => fresh.status === "filled" ? null : {version: fresh.version, deposits: change(fresh.deposits || [])});

async function addDeposit(ev) {

// What the desk changed (typed vs the copy it started from), after a refused save: shown and offered back, never lost silently.
function changesMade(typed, base) {
  const same = (k, x, y) => k === "phone" ? String(x).replace(/\D/g, "") === String(y || "").replace(/\D/g, "") : squash(x) === squash(y);
  const fields = {};
  for (const k of Object.keys(LABELS)) if (k in typed && !same(k, typed[k], base[k])) fields[k] = typed[k];
  const key = ln => [squash(ln.desc), hundredths(ln.qty === "" ? 1 : ln.qty), hundredths(ln.price ?? ""), hundredths(ln.labor ?? "")].join("|");
  const linesChanged = typed.lines.map(key).join("~") !== (base.lines || []).map(key).join("~");
  return {fields, lines: linesChanged ? typed.lines : null};
}

function showUnsaved(ch, t) {
  const items = Object.entries(ch.fields).map(([k, v]) => LABELS[k] + ": " + (v || "(blank)"));
  if (ch.lines) {
    items.push("Lines: " + (ch.lines.map(ln => [ln.desc, ln.qty && "qty " + ln.qty, ln.price && "price " + ln.price,
      ln.labor && "labor " + ln.labor].filter(Boolean).join(", ")).join(" / ") || "(none)"));
  }
  const box = $("unsaved");
  if (!box || !items.length) return;
  box.replaceChildren(el("b", {text: "Your unsaved changes:"}), el("ul", {}, items.map(d => el("li", {text: d}))),
    editable(t) ? el("button", {type: "button", text: "Put my changes back", onclick: () => reapply(ch)}) : null);
  box.hidden = false;
}

function reapply(ch) {  // only what the desk changed, on top of the other device's version
  const v = $("viewTicket");
  for (const [k, val] of Object.entries(ch.fields)) {
    const i = v.querySelector("#t-" + k);
    if (!i || i.readOnly) continue;
    if (i.tagName === "SELECT" && ![...i.options].some(o => o.value === val)) i.append(el("option", {value: val, text: val}));
    i.value = val;
  }
  if (ch.lines) $("tLines").replaceChildren(...ch.lines.map(ln => lineRow(ln, true)));
  $("unsaved").hidden = true;
  markDirty();
  recalc();
}

function onTicket(id) { return S.view === "ticket" && S.cur && S.cur.id === id; }

function setBusy(on) {
  S.busy = on;
  for (const b of $("viewTicket").querySelectorAll("button")) b.disabled = on;
  $("btnBoard").disabled = on;
}

// Every write: sends the version the page last saw. Returns the new ticket or null (error shown, or the desk left).
// retry(fresh) -> a body to send once more after a 409 with the server's copy, or null to show the conflict.
async function post(path, body, retry) {
  if (S.busy || !S.cur) return null;
  const base = S.cur, id = base.id, typed = S.dirty && editable(base) ? readForm() : null;
  setBusy(true);
  try {
    let r;
    try {
      r = await api("POST", path, body);
    } catch (e) {
      const again = e.status === 409 && e.data && e.data.ticket && retry && onTicket(id) ? retry(e.data.ticket) : null;
      if (!again) throw e;
      r = await api("POST", path, again);
    }
    S.etag = "";  // next poll fetches the new board
    return onTicket(id) ? r.data : null;
  } catch (e) {
    if (!onTicket(id)) return null;
    if (e.status === 409) {
      const t = e.data && e.data.ticket;
      if (t) {
        loadTicket(t);
        if (t.status === "review") loadMechanics();  // for next time; not awaited
        if (typed) showUnsaved(changesMade(typed, base), t);
      }
      tError((e.message || "Changed on another device") + " — showing the current ticket.");
    } else if (e.status === 400) {
      clearTicketErrors();
      showErrors($("viewTicket"), e, $("tErr"));
    } else if (e.status !== 401) {
      tError(e.message || "Couldn't save");
    }
    return null;
  } finally {
    setBusy(false);
  }
}

let savedTimer = 0;
async function save(quiet) {
  if (!S.cur || !editable(S.cur)) return S.cur;
  clearTicketErrors();
  const t = await post("/api/tickets/" + S.cur.id, readForm());
  if (t) {  // post() returns null once the desk has left this ticket
    loadTicket(t);  // first, with no await before it: the buttons must never carry the old version
    if (t.status === "review") loadMechanics();  // for next time; not awaited
    if (!quiet && $("saved")) {
      $("saved").textContent = "Saved.";
      clearTimeout(savedTimer);
      savedTimer = setTimeout(() => { if ($("saved")) $("saved").textContent = ""; }, 3000);
    }
    poll();
  }
  return t;
}

async function move(to, note) {
  let t = S.cur;
  if (S.dirty) {  // keep the desk's fixes: save first, then move with the new version
    t = await save(true);
    if (!t) return null;
  }
  const body = {version: t.version, to};
  if (note !== undefined) body.note = note;
  const r = await post("/api/tickets/" + t.id + "/move", body);
  if (r) poll();
  return r;
}

async function sendBack() {
  const mech = $("t-mechanic");
  if (!(mech ? mech.value : S.cur.mechanic).trim()) {
    tError("Pick the mechanic first — the ticket goes back to them.");
    return;
  }
  let note = "";
  while (!note) {
    const n = prompt("What should the mechanic fix? (required)");
    if (n === null) return;
    note = n.trim();
  }
  const t = await move("working", note);
  if (t) { S.dirty = false; leaveTicket(); flash("Sent back to " + (t.mechanic || "the mechanic") + ".", "ok"); }
}

async function approve() {
  const t = await move("approved");
  if (t) { loadTicket(t); flash("Approved — ready for InvoMax.", "ok"); }
}

async function markFilled() {
  if (!confirm((S.dirty ? "Save your changes and mark filled? Make sure InvoMax has the same prices."
                        : "Mark this ticket as filled in InvoMax?") + " It leaves the board.")) return;
  const t = await move("filled");
  if (t) { S.dirty = false; leaveTicket(); flash("Marked filled: " + fullName(t) + ".", "ok"); }
}

/* ---------- signed in as ---------- */

async function loadMe() {
  try {
    const d = (await api("GET", "/api/me")).data;
    S.me = {role: String(d.role || ""), name: String(d.name || ""), id: typeof d.id === "number" ? d.id : null};
    $("me").textContent = S.me.name ? "Signed in as " + S.me.name : "";
    if (S.view === "users") renderUsers();
  } catch (e) { /* the header just stays blank */ }
}

function isMe(u) {
  if (!S.me) return false;
  if (S.me.id !== null) return u.id === S.me.id;
  return u.role === "admin" && String(u.name).toLowerCase() === S.me.name.toLowerCase();
}

$("logoutForm").addEventListener("submit", ev => {
  if (hasTyping() && !confirm("Sign out and lose what you typed?")) ev.preventDefault();
});

/* ---------- mechanics & admins ---------- */

const SECRET = {  // what each role signs in with (accounts.py: PIN 6-8 digits, password 10+ characters)
  mechanic: {word: "PIN", hint: "6 to 8 digits. The mechanic signs in on the phone page with their name and this PIN.",
             inputMode: "numeric", pattern: "[0-9]*", maxLength: 8},
  admin: {word: "password", hint: "At least 10 characters. Signs in on this admin page.",
          inputMode: "text", pattern: "", maxLength: 200},
};

function secretKind(role) { return SECRET[role] || SECRET.mechanic; }
function secretOk(role, s) { return role === "admin" ? s.length >= 10 : /^[0-9]{6,8}$/.test(s); }  // the server checks too
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function shapeSecret(p, role) {  // the right keyboard and words for the role; p: "a" (add) or "r" (reset)
  const k = secretKind(role);
  for (const i of [$(p + "-secret"), $(p + "-again")]) {
    i.inputMode = k.inputMode;
    if (k.pattern) i.setAttribute("pattern", k.pattern); else i.removeAttribute("pattern");
    i.maxLength = k.maxLength;
    const pin = role !== "admin";  // a PIN never goes to the browser's password store (keychain) on the admin's iPad
    i.type = pin ? "text" : "password";
    i.autocomplete = pin ? "off" : "new-password";
    i.classList.toggle("pin", pin);
    i.autocapitalize = "off"; i.spellcheck = false;
  }
  $(p + "-label").textContent = p === "r" ? "New " + k.word : cap(k.word);
  $(p + "-label2").textContent = "Same " + k.word + " again";
  $(p + "-hint").textContent = k.hint;
}

function usersBusy(on) {  // one save at a time on the users screen: its buttons wait for the reply
  S.busy = on;
  for (const b of $("viewUsers").querySelectorAll("button")) b.disabled = on;
}

function boxMsg(id, text) { const b = $(id); b.textContent = text || ""; b.hidden = !text; }

function clearFieldErrors(root) { for (const d of root.querySelectorAll(".ferr")) d.textContent = ""; }

function fieldErrors(root, err, box) {  // 400 {errors: {name|role|secret|active}} next to the fields, the rest in box
  const errors = (err.data && err.data.errors) || {};
  const rest = [];
  for (const [k, v] of Object.entries(errors)) {
    const d = root.querySelector('.ferr[data-for="' + k + '"]');
    if (d) d.textContent = cap(String(v)); else rest.push(cap(String(v)));
  }
  boxMsg(box, rest.length ? rest.join("; ") : Object.keys(errors).length ? "" : cap(err.message || "Couldn't save"));
}

function fmtDate(iso) {
  const t = new Date(iso);
  return isFinite(t.getTime()) ? t.toLocaleDateString(undefined, {year: "numeric", month: "short", day: "numeric"}) : String(iso || "");
}

async function loadUsers() {
  try {
    const r = await api("GET", "/api/users");
    if (!Array.isArray(r.data.users)) throw new Http(200, {error: "Unexpected reply from the server"});
    S.users = r.data.users;
    renderUsers();
  } catch (e) {
    if (e.status !== 401) boxMsg("uErr", e.message || "Couldn't load the list");
  }
}

function renderUsers() {
  const rows = S.users.map(u => {
    const me = isMe(u), word = secretKind(u.role).word, role = u.role === "admin" ? "Admin" : "Mechanic";
    return el("tr", {class: u.active ? "" : "off"},
      el("td", {class: "c-name"}, el("b", {text: u.name}), me ? el("span", {class: "you", text: "you"}) : null,
        el("span", {class: "role-inline", text: role})),  // narrow screens: the role under the name
      el("td", {class: "c-role", text: role}),
      el("td", {}, el("span", {class: "onoff" + (u.active ? "" : " no"), text: u.active ? "On" : "Off"})),
      el("td", {class: "c-created", text: fmtDate(u.created)}),
      el("td", {}, el("div", {class: "btns"},
        el("button", {type: "button", class: "light", text: "Reset " + word, onclick: () => openReset(u)}),
        el("button", {type: "button", class: u.active ? "warn" : "go", text: u.active ? "Turn off" : "Turn on",
                      onclick: () => setActive(u, !u.active)}))));
  });
  if (!rows.length) rows.push(el("tr", {}, el("td", {colSpan: 5, class: "empty", text: "No accounts yet."})));
  $("uList").replaceChildren(...rows);
}

function showUsers() {
  flash("");
  boxMsg("uErr", ""); boxMsg("uOk", ""); boxMsg("kErr", ""); boxMsg("kOk", "");
  show("users");
  renderUsers();
  loadUsers();
  loadMe();
}

function leaveUsers() {
  if (hasTyping() && !confirm("Leave without saving what you typed?")) return;
  $("addForm").reset(); clearFieldErrors($("addForm")); boxMsg("addErr", "");
  closeReset();
  show("board");
}

function addRoleChanged() {
  shapeSecret("a", $("a-role").value);
}

async function addUser(ev) {
  ev.preventDefault();
  if (S.busy) return;
  const f = $("addForm"), role = f.elements.role.value, word = secretKind(role).word;
  clearFieldErrors(f); boxMsg("addErr", ""); boxMsg("uOk", "");
  if (f.elements.secret.value !== f.elements.again.value) {
    f.querySelector('.ferr[data-for="again"]').textContent = "The two " + word + "s don't match.";
    return;
  }
  usersBusy(true);
  try {
    const r = await api("POST", "/api/users", {name: f.elements.name.value, role, secret: f.elements.secret.value});
    f.reset(); addRoleChanged();
    boxMsg("uOk", "Added " + r.data.name + " (" + (r.data.role === "admin" ? "admin" : "mechanic") + ").");
    loadUsers();
  } catch (e) {
    if (e.status === 400) fieldErrors(f, e, "addErr");
    else if (e.status !== 401) boxMsg("addErr", e.message || "Couldn't add");
  } finally {
    usersBusy(false);
  }
}

function openReset(u) {
  const word = secretKind(u.role).word;
  S.resetting = u;
  $("resetForm").reset(); clearFieldErrors($("resetForm")); boxMsg("resetErr", "");
  $("resetTitle").textContent = "Reset " + word + " for " + u.name;
  shapeSecret("r", u.role);
  boxMsg("resetWarn", isMe(u) ? "This is your own " + word + ". Your other devices will be signed out; this one stays signed in."
                              : u.name + " will be signed out everywhere and must use the new " + word + ".");
  $("resetBox").hidden = false;
  $("resetBox").scrollIntoView({block: "start"});
  $("r-secret").focus();
}

function closeReset() {
  S.resetting = null;
  $("resetForm").reset(); clearFieldErrors($("resetForm")); boxMsg("resetErr", "");
  $("resetBox").hidden = true;
}

async function resetSecret(ev) {
  ev.preventDefault();
  const u = S.resetting, f = $("resetForm");
  if (!u || S.busy) return;
  const word = secretKind(u.role).word;
  clearFieldErrors(f); boxMsg("resetErr", ""); boxMsg("uOk", "");
  if (!f.elements.secret.value) { f.querySelector('.ferr[data-for="secret"]').textContent = "Type the new " + word + "."; return; }
  if (f.elements.secret.value !== f.elements.again.value) {
    f.querySelector('.ferr[data-for="again"]').textContent = "The two " + word + "s don't match.";
    return;
  }
  if (!secretOk(u.role, f.elements.secret.value)) {
    f.querySelector('.ferr[data-for="secret"]').textContent = secretKind(u.role).hint.split(".")[0] + ".";
    return;
  }
  if (!confirm(isMe(u) ? "Change your own " + word + "? Your other devices will be signed out."
                       : "Set a new " + word + " for " + u.name + "? They'll be signed out everywhere.")) return;
  usersBusy(true);
  try {
    await api("POST", "/api/users/" + u.id, {secret: f.elements.secret.value});
    closeReset();
    boxMsg("uOk", "New " + word + " saved for " + u.name + ".");
    loadUsers();
  } catch (e) {
    if (e.status === 400) fieldErrors(f, e, "resetErr");
    else if (e.status !== 401) boxMsg("resetErr", e.message || "Couldn't save");
  } finally {
    usersBusy(false);
  }
}

async function setActive(u, active) {
  if (S.busy) return;
  const me = isMe(u);
  const q = active ? "Turn " + u.name + " back on? They can sign in again."
          : me ? "Turn off your own account? You'll be signed out right away and can't sign in again until another admin turns you back on."
          : "Turn off " + u.name + "? They'll be signed out everywhere and can't sign in" +
            (u.role === "mechanic" ? "; their name leaves the mechanic list." : ".");
  if (!confirm(q)) return;
  boxMsg("uErr", ""); boxMsg("uOk", "");
  usersBusy(true);
  try {
    await api("POST", "/api/users/" + u.id, {active});
    if (me && !active) { location.reload(); return; }  // signed out: the sign-in page
    boxMsg("uOk", u.name + (active ? " is on again." : " is turned off."));
    loadUsers();
    if (u.role === "mechanic") loadMechanics();
  } catch (e) {
    if (e.status === 400) {
      const errs = (e.data && e.data.errors) || {};
      boxMsg("uErr", errs.active ? (/admin/.test(errs.active) ? "Can't turn off the last admin — add another admin first."
                                                                : cap(String(errs.active)))
                                 : cap(e.message || "Couldn't change it"));
    } else if (e.status !== 401) boxMsg("uErr", e.message || "Couldn't change it");
  } finally {
    usersBusy(false);
  }
}

async function useForCheckin() {
  if (S.busy) return;
  if (!confirm((hasTyping() ? "What you typed on this page will be lost. " : "") +
               "This signs you out here and turns this iPad into the customer check-in screen. " +
               "Don't let Safari save your password on this iPad. Turn on Guided Access to keep customers on this page. Continue?")) return;
  boxMsg("kErr", ""); boxMsg("kOk", "");
  usersBusy(true);
  try {
    await api("POST", "/api/kiosk", {});
    location.replace("/checkin");  // Back can't return to the admin page
  } catch (e) {
    if (e.status !== 401) boxMsg("kErr", e.message || "Couldn't set up check-in");
    usersBusy(false);
  }
}

async function revokeKiosks() {
  if (S.busy) return;
  if (!confirm("Sign out every check-in iPad? Each one will need to be set up again from this page.")) return;
  boxMsg("kErr", ""); boxMsg("kOk", "");
  usersBusy(true);
  try {
    await api("POST", "/api/kiosk/revoke", {});
    boxMsg("kOk", "All check-in iPads are signed out.");
  } catch (e) {
    if (e.status !== 401) boxMsg("kErr", e.message || "Couldn't sign them out");
  } finally {
    usersBusy(false);
  }
}

/* ---------- start ---------- */

$("btnNew").addEventListener("click", () => { flash(""); clearNewErrors(); show("new"); $("n-first").focus(); });
$("btnUsers").addEventListener("click", showUsers);
$("btnBoard").addEventListener("click", () => S.view === "ticket" ? leaveTicket() : S.view === "users" ? leaveUsers() : leaveNew());
$("a-role").addEventListener("change", addRoleChanged);
$("addForm").addEventListener("submit", addUser);
$("resetForm").addEventListener("submit", resetSecret);
$("btnCancelReset").addEventListener("click", closeReset);
$("btnKiosk").addEventListener("click", useForCheckin);
$("btnRevoke").addEventListener("click", revokeKiosks);
$("btnCancelNew").addEventListener("click", leaveNew);
$("newForm").addEventListener("submit", createTicket);
for (const e of ["focusin", "input", "change"]) document.addEventListener(e, carField);
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
window.addEventListener("pageshow", e => { if (e.persisted) location.reload(); });  // from the back/forward cache: ask the server again

show("board");
fillList("year-list", Array.from({length: NEXT_YEAR - FIRST_YEAR + 1}, (_, i) => String(NEXT_YEAR - i)));
addRoleChanged();
loadMe();
loadVehicles();
loadMechanics();
poll();
setInterval(poll, POLL_MS);
setInterval(updateAges, AGE_MS);
</script>
</body></html>
