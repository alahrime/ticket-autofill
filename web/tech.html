<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechanic</title>
<style>
*{box-sizing:border-box}
body{font:17px/1.35 system-ui,sans-serif;margin:0 auto;max-width:640px;padding:0 12px 48px;background:#f4f4f4;color:#222}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;position:sticky;top:0;background:#f4f4f4;z-index:2}
header b{font-size:18px}
h1{font-size:22px;margin:16px 0}
h2{font-size:18px;margin:18px 0 6px;color:#444}
h3{font-size:18px;margin:0 0 4px}
button{font:inherit;min-height:48px;padding:10px 16px;border:0;border-radius:8px;background:#1f5fbf;color:#fff;cursor:pointer}
button.light{background:#ddd;color:#222}
button.danger{background:#fde2e2;color:#900}
button.danger.solid{background:#b3261e;color:#fff}
button.link{background:none;color:#1f5fbf;padding:8px 4px;font-size:15px;text-decoration:underline}
button.wide{display:block;width:100%;margin:8px 0}
button:disabled{opacity:.5}
input,textarea{font:inherit;font-size:18px;width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff;color:#222}
textarea{min-height:96px;resize:vertical}
label{display:block;font-size:14px;color:#555;margin:10px 0 0}
label input,label textarea{margin-top:4px}
.card{background:#fff;border-radius:10px;padding:12px;margin:8px 0}
.tk{display:flex;gap:10px;align-items:center}
.tk .info{flex:1;min-width:0;text-align:left;background:none;color:#222;padding:0;min-height:0;display:block}
.tk.mine{padding:0}
.tk.mine .info{padding:12px}
.who{font-weight:600;display:block}
.age{float:right;color:#666;font-size:14px;margin-left:8px}
.car{color:#444;display:block}
.req{color:#666;font-size:15px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{display:inline-block;background:#fff3b0;color:#7a5600;border-radius:6px;padding:1px 6px;font-size:13px;margin-top:4px}
.big{font-size:20px;font-weight:600}
.backnote{background:#fff3b0;border-left:4px solid #c90;padding:10px;border-radius:6px;margin-top:8px;white-space:pre-wrap}
.backnote b{display:block;font-size:14px;color:#7a5600}
.pre{white-space:pre-wrap}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.empty{color:#666;margin:6px 0}
.err{color:#b00}
.ferr{color:#b00;font-size:15px;margin:4px 0 0;white-space:pre-wrap}
.ferr:empty{display:none}
.fwarn{color:#7a5600;font-size:15px;margin:4px 0 0}
.fwarn:empty{display:none}
#msg{background:#fde2e2;color:#900;padding:12px;border-radius:8px;margin:8px 0;white-space:pre-wrap}
#msg.ok{background:#e2f5e2;color:#185c18}
#net{color:#900;font-size:14px}
#saved{color:#185c18;font-size:14px}
#banner{background:#fff3b0;padding:8px 12px;border-radius:8px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}
#hints button{display:block;width:100%;text-align:left;background:#eef3fb;color:#222;margin-top:4px;font-size:16px}
#hints small{display:block;color:#555}
.line .desc{font-weight:600}
.line .det{color:#444}
.line .acts{display:flex;gap:8px;margin-top:8px}
.line .acts button{flex:1}
.tot{display:flex;justify-content:space-between}
.tot.sum{font-weight:700;font-size:19px;border-top:1px solid #ddd;padding-top:6px;margin-top:4px}
#signedin{font-size:15px;color:#444}
#signedin b{font-size:16px;color:#222}
#signout{margin:0;flex:none}
#signout button{min-height:40px;padding:6px 12px;font-size:15px}
#lineform{border:2px solid #1f5fbf;scroll-margin-top:72px}
#custform{border:2px solid #1f5fbf}
dialog{border:0;border-radius:12px;padding:16px;width:min(460px,calc(100vw - 24px));box-shadow:0 4px 24px #0004;color:#222}
dialog::backdrop{background:#0007}
dialog h3,dialog p{overflow-wrap:anywhere}
dialog p{margin:8px 0}
[hidden]{display:none!important}
</style></head><body>
<header><div><span id="signedin" hidden>Signed in as <b id="me"></b></span> <span id="saved" aria-live="polite"></span> <span id="net" aria-live="polite"></span></div>
<form id="signout" method="post" action="/logout" hidden><button class="light" type="submit">Sign out</button></form></header>
<div id="msg" role="alert" hidden></div>

<section id="start">
  <p id="startmsg" class="empty">Loading…</p>
  <button id="retry" class="light" type="button" hidden>Try again</button>
</section>

<section id="home" hidden>
  <button id="newcust" class="wide" type="button">New customer</button>
  <form id="custform" class="card" autocomplete="off" novalidate hidden>
    <h3>New customer</h3>
    <label>First name <input name="first" maxlength="80" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"></label>
    <p class="ferr" data-for="first"></p>
    <label>Last name <input name="last" maxlength="80" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"></label>
    <p class="ferr" data-for="last"></p>
    <label>Phone <input name="phone" type="tel" inputmode="tel" maxlength="30" autocomplete="off"></label>
    <p class="ferr" data-for="phone"></p>
    <label>Year <input name="year" inputmode="numeric" maxlength="4" list="year-list" autocomplete="off"></label>
    <p class="ferr" data-for="year"></p>
    <label>Make <input name="make" maxlength="80" list="make-list" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"></label>
    <p class="ferr" data-for="make"></p>
    <label>Model <input name="model" maxlength="80" list="model-list" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"></label>
    <p class="ferr" data-for="model"></p>
    <label>Plate <input name="plate" maxlength="80" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"></label>
    <p class="ferr" data-for="plate"></p>
    <label>What the customer wants done <textarea name="request" maxlength="2000"></textarea></label>
    <p class="ferr" data-for="request"></p>
    <p id="cerr" class="ferr" role="alert"></p>
    <div class="row" style="margin-top:12px"><button type="submit" id="csave">Check in</button><button type="button" class="light" id="ccancel">Cancel</button></div>
  </form>
  <h2>My jobs</h2>
  <div id="mine"></div>
  <h2>Waiting</h2>
  <div id="waiting"></div>
  <h2>My invoices</h2>
  <div id="invoices"></div>
</section>

<section id="job" hidden>
  <button id="back" class="light" type="button">&lsaquo; Jobs</button>
  <div id="banner" hidden><span>Changed on another device —</span><button id="reload" type="button">Reload</button></div>
  <div class="card">
    <div id="jcust" class="big"></div>
    <div id="jcar" class="car"></div>
    <div id="jreq" class="pre"></div>
    <div id="jback" class="backnote" hidden><b>Sent back by the desk:</b><span id="jbacktext"></span></div>
    <div id="jsent" class="backnote" hidden><b>Invoice at the desk, ready for InvoMax.</b><span>You can still fix the lines, odometer, VIN and notes until it's filled. The desk sees every change.</span></div>
  </div>

  <h2>Lines</h2>
  <div id="lines"></div>
  <div class="row" id="addbtns"><button id="addpart" type="button">Add part</button><button id="addlabor" type="button">Add labor</button></div>

  <form id="lineform" class="card" autocomplete="off" hidden>
    <h3 id="lftitle"></h3>
    <label>Description <input id="ldesc" maxlength="200" autocapitalize="characters"></label>
    <div id="hints"></div>
    <div class="row partonly">
      <label>Qty <input id="lqty" inputmode="decimal"></label>
      <label>Price each <input id="lprice" inputmode="decimal" placeholder="0.00"></label>
    </div>
    <label>Labor <input id="llabor" inputmode="decimal" placeholder="0.00"></label>
    <p id="lerr" class="ferr" role="alert"></p>
    <div class="row" style="margin-top:12px"><button type="submit" id="lsave">Save line</button><button type="button" class="light" id="lcancel">Cancel</button></div>
  </form>

  <div id="totals" class="card"></div>

  <label>Odometer <input id="odo" inputmode="numeric" autocomplete="off" maxlength="9"></label>
  <p id="odoerr" class="ferr" role="alert"></p>
  <label>VIN <input id="vin" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" maxlength="30"></label>
  <p id="vinerr" class="ferr" role="alert"></p>
  <p id="vinwarn" class="fwarn"></p>
  <label>Notes <textarea id="notes" maxlength="2000"></textarea></label>
  <p id="noteserr" class="ferr" role="alert"></p>

  <button id="finish" class="wide" type="button" style="margin-top:20px">Finish job</button>
  <button id="deljob" class="wide danger" type="button" style="margin-top:28px">Delete job</button>
</section>

<dialog id="deldlg" aria-labelledby="deltitle">
  <form method="dialog">
    <h3 id="deltitle"></h3>
    <p id="delkeep"></p>
    <div class="row"><button value="delete" class="danger solid">Delete</button><button value="cancel" class="light" id="delno" autofocus>Cancel</button></div>
  </form>
</dialog>
<datalist id="year-list"></datalist>
<datalist id="make-list"></datalist>
<datalist id="model-list"></datalist>

<script>
"use strict";
const $ = id => document.getElementById(id);
const FIELDS = [["odo", "odometer", "odoerr"], ["vin", "vin", "vinerr"], ["notes", "notes", "noteserr"]];  // box id, ticket field, error box id
const errBox = k => { const f = FIELDS.find(x => x[1] === k); return f ? $(f[2]) : null; };
let me = "", uid = "", reloading = false, list = [], etag = "", cur = null, editing = null, formStart = "", code = "", hintDesc = "";
let queue = Promise.resolve(), pending = 0, polling = false, hintSeq = 0, hintTimer = 0, savedTimer = 0, fieldTimer = 0;
const known = {};   // id -> newest copy of that ticket this phone saved or loaded; queued saves take their version from it
const queued = {};  // field -> value already waiting in the save queue
const GONE_TEXT = "This ticket was removed by the desk.";  // 410
const NOT_HERE = "Not available on this server.";  // check-in / delete on the old Python server (403)
const KEPT = ["approved", "filled"];  // deleted, these stay in the records (never purged)

function load(k) { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } }
function store(k, v) { try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch (e) { /* private mode */ } }

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function btn(text, cls, onclick) {
  const b = el("button", cls, text);
  b.type = "button";
  b.addEventListener("click", onclick);
  return b;
}
const cap = s => { s = String(s || ""); return s.charAt(0).toUpperCase() + s.slice(1); };
const money = v => "$" + (Number(v) || 0).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const plain = v => v == null ? "" : (Number(v) || 0).toFixed(2);
const initial = s => (s || "").trim() ? (s || "").trim()[0] + "." : "";
const shortName = t => [t.first, initial(t.last)].filter(Boolean).join(" ");
const vehicle = t => [t.year, t.make, t.model].filter(Boolean).join(" ");
// Mine to change: my job while I work on it, and my invoice once the desk has sent it (until it's filled).
const mineNow = t => (t.status === "working" || t.status === "approved") && t.mechanic === me;  // the account name as is

function age(iso) {
  const t = Date.parse(iso);  // server local time without a zone: read as local time
  if (isNaN(t)) return "";
  const m = Math.max(0, Math.round((Date.now() - t) / 60000));
  if (m < 60) return m + " min";
  const h = Math.floor(m / 60);
  return h < 24 ? h + " h" : Math.floor(h / 24) + " d";
}

function say(text, ok) {
  const m = $("msg");
  m.textContent = text || "";
  m.className = ok ? "ok" : "";
  m.hidden = !text;
  if (text) m.scrollIntoView({block: "nearest"});
}
function saved() {
  $("saved").textContent = "Saved";
  clearTimeout(savedTimer);
  savedTimer = setTimeout(() => { $("saved").textContent = ""; }, 2000);
}
function errText(e) {
  const d = (e && e.data) || {};
  if (d.errors && typeof d.errors === "object") {
    const msgs = Object.values(d.errors).map(cap);
    if (msgs.length) return msgs.join("\n");
  }
  if (d.error) return cap(d.error);
  return e && e.status > 0 ? `The shop PC had a problem (${e.status}).` : "Something went wrong.";
}
function clearFieldErrors() {
  for (const id of ["lerr", ...FIELDS.map(f => f[2])]) $(id).textContent = "";
}
function showErrors(e) {  // 400: each message next to its field; the rest at the top
  const errs = (e.data && e.data.errors) || {}, rest = [];
  for (const [k, v] of Object.entries(errs)) {
    const box = errBox(k) || (k === "lines" && editing ? $("lerr") : null);
    if (box) box.textContent = cap(v);
    else rest.push(cap(v));
  }
  if (!Object.keys(errs).length) rest.push(errText(e));
  if (rest.length) say(rest.join("\n"));
}

class Http extends Error {
  constructor(status, data) {
    super((data && data.error) || ("error " + status));
    this.status = status;
    this.data = data || {};
  }
}
function timeoutSignal(ms) {
  if (typeof AbortSignal !== "undefined" && AbortSignal.timeout) return AbortSignal.timeout(ms);
  if (typeof AbortController === "undefined") return undefined;
  const c = new AbortController();
  setTimeout(() => c.abort(), ms);
  return c.signal;
}
async function api(path, body, headers, keepalive) {
  const opt = {headers: Object.assign({}, headers || {}), credentials: "same-origin", cache: "no-store", signal: timeoutSignal(15000)};
  if (body !== undefined) {
    opt.method = "POST";
    opt.headers["Content-Type"] = "application/json";
    opt.body = JSON.stringify(body);
    if (keepalive) opt.keepalive = true;  // still sent when the page is closing
  }
  let r;
  try {
    r = await fetch(path, opt);
  } catch (e) {  // offline, or no answer in 15 s
    throw new Http(0, {error: "Can't reach the shop. Check your connection and try again."});
  }
  if (r.status === 401) {  // signed out (or the session ran out): the reload shows the sign-in page
    reloading = true;
    location.reload();
    throw new Http(401, {error: "sign in"});
  }
  const tag = r.headers.get("ETag") || "";
  if (r.status === 304) return {status: 304, data: null, etag: tag};
  let data = null;
  try { data = await r.json(); } catch (e) { data = null; }
  if (!r.ok) throw new Http(r.status, data);
  if (data === null || typeof data !== "object") throw new Http(r.status, {error: "Unexpected reply from the shop PC."});
  return {status: r.status, data, etag: tag};
}

// ---- screens and routing (#t<id> = a job, so the phone's Back button works)
function show(name) {
  for (const s of ["start", "home", "job"]) $(s).hidden = s !== name;
}
function goHome() {  // no questions asked: callers deal with an open line first
  closeForm();
  if (location.hash) location.hash = "";
  else route();
}
function leaveJob() {  // keeps the boxes typed so far (sent with the ticket's own version), then forgets the job
  if (!cur) return;
  saveFields();
  cur = null;
  closeForm();
  clearFieldErrors();
}
function route() {
  const m = /^#t([0-9]+)$/.exec(location.hash);
  const id = m ? Number(m[1]) : 0;
  if (cur && cur.id !== id) {
    if (!discardLine()) {  // Back pressed with a half-typed line: stay
      history.pushState(null, "", "#t" + cur.id);
      return;
    }
    leaveJob();
  }
  if (!me) return;  // still finding out who's signed in
  if (id) {
    if (cur && cur.id === id) show("job");
    else loadJob(id);
  } else {
    show("home");
    renderHome();
  }
}
window.addEventListener("hashchange", route);

// ---- who am I (the server only serves this page to a signed-in mechanic)
async function whoAmI() {
  show("start");
  $("startmsg").textContent = "Loading…";
  $("startmsg").className = "empty";
  $("retry").hidden = true;
  try {
    const r = await api("/api/me");
    const name = r.data.name, id = r.data.id;
    if (typeof name !== "string" || !name || id == null) {
      $("startmsg").textContent = "Unexpected reply from the shop PC.";
      $("startmsg").className = "err";
      $("retry").hidden = false;
      return;
    }
    // Someone else signed in on this phone (another tab), or not as a mechanic: start over as whoever it is now.
    if (r.data.role !== "mechanic" || me && (name !== me || String(id) !== uid)) {
      reloading = true;
      return location.reload();
    }
    me = name;
    uid = String(id);  // drafts are kept per account
  } catch (e) {
    if (e.status === 401) return;
    $("startmsg").textContent = errText(e);
    $("startmsg").className = "err";
    $("retry").hidden = false;
    return;
  }
  $("me").textContent = me;
  $("signedin").hidden = false;
  $("signout").hidden = false;
  forgetOthers();
  route();
  poll();
}
$("retry").addEventListener("click", whoAmI);
function forgetOthers() {  // phones may be shared: drop drafts (and the old name) left by anyone else
  try {
    const mine = draftPrefix(), drop = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k === "tech.me" || k && k.startsWith("tech.draft.") && !k.startsWith(mine)) drop.push(k);
    }
    for (const k of drop) localStorage.removeItem(k);
  } catch (e) { /* private mode */ }
}
function myDrafts() {  // ids of jobs with odometer/VIN/notes typed on this phone that never reached the server
  const out = [];
  try {
    const mine = draftPrefix();
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith(mine) && localStorage.getItem(k)) out.push(k.slice(mine.length));
    }
  } catch (e) { /* private mode */ }
  return out;
}
let signingOut = false, signBusy = false;  // signingOut: the logout POST is going; signBusy: deciding whether to send it
function signDone() {
  signBusy = false;
  $("signout").querySelector("button").disabled = false;
}
$("signout").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (signingOut || signBusy || reloading) return;
  signBusy = true;
  $("signout").querySelector("button").disabled = true;
  try {
    if (!discardLine()) return signDone();
    closeForm();
    say("");
    saveFields();  // typed odometer/VIN/notes go first
    await queue;
    if (reloading) return;  // the session was already gone: the sign-in page is on its way
    const left = myDrafts().length || Object.keys(dirtyBoxes()).length;
    if (left && !confirm("Some odometer, VIN or notes changes haven't reached the shop yet and will be lost. Sign out anyway?")) return signDone();
    if (navigator.onLine === false) {  // the POST wouldn't get there: keep everything
      say("You're offline — sign out when you're back online.");
      return signDone();
    }
    for (const id of myDrafts()) store(draftPrefix() + id, "");
    signingOut = true;
    closeCust();  // a shared phone: a half-typed customer doesn't stay in the page
    $("signout").submit();  // the server clears the session and shows the sign-in page
  } catch (e) {
    signDone();
    throw e;
  }
});
window.addEventListener("pageshow", ev => {  // back from the sign-in page via the browser's page cache
  if (ev.persisted) { signingOut = false; signDone(); }
});

// ---- home lists
function renderHome() {
  const mine = list.filter(t => t.status === "working" && mineNow(t));
  const waiting = list.filter(t => t.status === "waiting").reverse();  // longest waiting first
  const sent = list.filter(t => t.status === "approved" && mineNow(t));
  fill($("mine"), mine.map(t => card(t, false)), "No jobs yet. Accept one below.");
  fill($("waiting"), waiting.map(t => card(t, true)), "Nothing waiting.");
  fill($("invoices"), sent.map(t => card(t, false)), "None at the desk right now.");
}
function fill(box, cards, empty) {
  box.replaceChildren(...(cards.length ? cards : [el("p", "empty", empty)]));
}
function card(t, waiting) {
  const c = el("div", "card tk" + (waiting ? "" : " mine"));
  const info = el(waiting ? "div" : "button", "info");
  if (!waiting) {
    info.type = "button";
    info.addEventListener("click", () => openJob(t));
  }
  const top = el("span", "who", shortName(t));
  const ag = el("span", "age", age(t.created));
  ag.dataset.created = t.created || "";
  top.append(ag);
  info.append(top, el("span", "car", vehicle(t)));
  if (t.request) info.append(el("span", "req", t.request));
  if (!waiting && t.back_note) info.append(el("span", "tag", "Sent back"));
  if (t.status === "approved") info.append(el("span", "tag", "Ready for InvoMax · " + money((t.totals || {}).total)));
  c.append(info);
  if (waiting) {
    const b = btn("Accept", "", () => accept(t, b));
    c.append(b);
  }
  return c;
}

// Check-ins made here, each with the number of polls started before it: a poll that started earlier answers
// with the board from before, so the new card is kept until a poll started after it has answered.
let polls = 0;
const checkedIn = [];  // [{t, after}]
async function poll() {
  if (!me || polling || document.hidden) return;
  polling = true;
  const n = ++polls;
  try {
    const r = await api("/api/tickets?status=waiting,working,approved", undefined, etag ? {"If-None-Match": etag} : {});
    $("net").textContent = "";
    if (r.status !== 304) {  // 304: nothing changed, keep the last list
      let got = r.data.tickets || [];
      if (got.some(t => t.status !== "waiting" && !mineNow(t))) {  // the server only sends my own: someone else is signed in now
        reloading = true;
        return location.reload();
      }
      for (const c of checkedIn.splice(0)) {
        if (n > c.after) continue;  // this poll saw the board after the check-in: it is the truth now
        checkedIn.push(c);
        if (!got.some(x => x.id === c.t.id)) got = [c.t, ...got];
      }
      list = got;
      etag = r.etag;
    }
    if (r.status === 304) {  // ages move on even when nothing changed: just their text, the cards stay
      for (const a of document.querySelectorAll("#home .age")) a.textContent = age(a.dataset.created);
    } else renderHome();
    checkOpen();
  } catch (e) {
    if (e.status !== 401) $("net").textContent = e.status === 0 ? "Offline, retrying…" : "Server trouble, retrying…";
  } finally {
    polling = false;
  }
}
function checkOpen() {  // the open job changed somewhere else (desk, another phone): offer a reload
  if (!cur || pending) return;
  const t = list.find(x => x.id === cur.id);
  if (!t || t.version > cur.version) $("banner").hidden = false;
  if (!t) probeOpen(cur.id);  // off the list: finished elsewhere, taken, or deleted (410)
}
async function probeOpen(id) {
  try { await api(`/api/tickets/${id}`); } catch (e) { if (e.status === 410 && (cur && cur.id === id)) dropJob(id, GONE_TEXT); }
}
// The job is gone from this phone (deleted here, or by the desk): its draft only, then home with text.
function dropJob(id, text, ok) {
  writeDraft(id, {});

  list = list.filter(x => x.id !== id);
  for (let i = checkedIn.length - 1; i >= 0; i--) if (checkedIn[i].t.id === id) checkedIn.splice(i, 1);
  etag = "";
  const here = (cur && cur.id === id) || location.hash === "#t" + id;
  if (cur && cur.id === id) {
    cur = null;  // no leaveJob: its save of the typed boxes would only be refused
    clearFieldErrors();
  }
  if (text) say(text, ok);
  if (here) goHome();
  else if (!$("home").hidden) renderHome();
  poll();
}

async function accept(t, b) {
  if (!confirm(`Accept ${shortName(t)}, ${vehicle(t)}?`)) return;
  b.disabled = true;
  say("");
  try {
    const r = await api(`/api/tickets/${t.id}/move`, {version: t.version, to: "working"});  // always accepted as the signed-in mechanic
    etag = "";
    openJob(r.data);
    poll();
  } catch (e) {
    b.disabled = false;
    if (e.status === 409 && e.data.ticket) {  // only a job still waiting or already mine gets here
      const x = e.data.ticket;
      if (mineNow(x)) { openJob(x); return; }  // took it on another phone
      say("This job just changed. Check it and tap Accept again.");
      etag = "";
      poll();
    } else if (e.status === 410) {
      dropJob(t.id, GONE_TEXT);
    } else if (e.status === 404 || e.status === 403) {  // someone else's now, or no longer waiting
      say("Someone else took this job, or it isn't waiting anymore.");
      etag = "";
      poll();
    } else if (e.status !== 401) {
      say(errText(e));
    }
  }
}

// ---- job screen
function remember(t) {
  if (!known[t.id] || t.version >= known[t.id].version) known[t.id] = t;
}
function openJob(t) {
  remember(t);
  setCur(t);
  say("");
  if (location.hash !== "#t" + t.id) location.hash = "t" + t.id;
  else show("job");
}
async function loadJob(id) {
  try {
    const r = await api(`/api/tickets/${id}`);
    if (location.hash !== "#t" + id) return;  // went elsewhere meanwhile
    const t = r.data;
    if (!mineNow(t)) {
      writeDraft(id, {});  // nothing left for this phone to save there
      say(t.status === "working" ? "That job belongs to someone else." : `That job is ${t.status} now.`);
      return goHome();
    }
    remember(t);
    setCur(t);
    show("job");
  } catch (e) {
    if (e.status === 401 || location.hash !== "#t" + id) return;
    if (e.status === 410) return dropJob(id, GONE_TEXT);
    if (e.status === 404) writeDraft(id, {});  // gone, or not this mechanic's: nothing to save there
    say(e.status === 404 ? "That job isn't yours anymore, or it's gone." : errText(e));
    goHome();
  }
}
// What the server would store for a typed value: trimmed; odometer without commas/spaces, VIN without any
// space and upper case (as tickets.normalize).
const tidy = (k, v) => k === "odometer" ? v.trim().replace(/[, ]/g, "") : k === "vin" ? v.replace(/[\s\x1c-\x1f\x85]/g, "").toUpperCase() : v.trim();
function dirtyBoxes() {  // odometer/VIN/notes typed but not yet on the server: {field: value as typed}
  const out = {};
  if (!cur) return out;
  for (const [id, k] of FIELDS) if (tidy(k, $(id).value) !== (cur[k] || "")) out[k] = $(id).value;
  return out;
}
// Unsaved odometer/VIN/notes are also kept on the phone per job until saved (survives a closed tab or dead battery).
// Keyed by account too (tech.draft.<user id>.<ticket id>): a shared phone never hands one mechanic's typing to another.
const draftPrefix = () => "tech.draft." + uid + ".";
const draftKey = id => draftPrefix() + id;
function readDraft(id) {
  try { return JSON.parse(load(draftKey(id)) || "{}") || {}; } catch (e) { return {}; }
}
function writeDraft(id, d) {
  store(draftKey(id), Object.keys(d).some(k => k !== "_base") ? JSON.stringify(d) : "");
}
function keepDraft() {
  if (!cur) return;
  const d = dirtyBoxes(), base = {};
  for (const k in d) base[k] = cur[k] || "";  // what the shop had when this was typed
  if (Object.keys(d).length) d._base = base;
  writeDraft(cur.id, d);
}
function draftSaved(id, fields) {  // the server has these values now: drop them from the draft unless retyped since
  const d = readDraft(id);
  for (const k in fields) if (d[k] === fields[k]) delete d[k];
  writeDraft(id, d);
}
function setCur(t) {
  // A box the mechanic changed (differs from the copy shown) is never overwritten; it is saved instead.
  const same = cur && cur.id === t.id;
  const dirty = same ? dirtyBoxes() : {};
  remember(t);
  cur = t;
  $("banner").hidden = true;
  $("jcust").textContent = shortName(t);
  $("jcar").textContent = vehicle(t) + (t.plate ? " · " + t.plate : "");
  $("jreq").textContent = t.request || "(no request written)";
  $("jbacktext").textContent = t.back_note || "";
  $("jback").hidden = !t.back_note;
  $("jsent").hidden = t.status !== "approved";
  $("finish").hidden = t.status !== "working";  // an invoice the desk already sent has nothing to finish
  renderLines();
  renderTotals();
  for (const [id, k] of FIELDS) {
    const box = $(id);  // an equivalent value ("abc " for "abc") is left as typed: no jumping under the cursor
    if (!(k in dirty) && tidy(k, box.value) !== (t[k] || "")) box.value = t[k] || "";
  }
  if (!same) {  // (re)opened: bring back anything typed here that never reached the server
    const d = readDraft(t.id), base = d._base && typeof d._base === "object" ? d._base : null, lost = [];
    for (const [id, k] of FIELDS) {
      if (typeof d[k] !== "string" || tidy(k, d[k]) === (t[k] || "")) continue;
      if (base && typeof base[k] === "string" && base[k] !== (t[k] || "")) lost.push(k);  // changed at the desk since: theirs stays
      else $(id).value = d[k];
    }
    if (lost.length) say(`The desk changed the ${lost.join(" and ")} after you typed here. Showing the desk's; type yours again if it's still needed.`);
    if (Object.keys(dirtyBoxes()).length) {
      clearTimeout(fieldTimer);
      fieldTimer = setTimeout(saveFields, 800);
    }

  showVinWarning();
  keepDraft();
}
function showVinWarning() {  // the server's warning for the stored VIN; hidden while a different one is typed
  $("vinwarn").textContent = cur && tidy("vin", $("vin").value) === (cur.vin || "") ? cur.vin_warning || "" : "";
}
function renderLines() {
  const box = $("lines");
  if (!cur.lines.length) return box.replaceChildren(el("p", "empty", "No lines yet."));
  box.replaceChildren(...cur.lines.map(ln => {
    const c = el("div", "card line");
    c.append(el("div", "desc", ln.desc));
    const bits = [];
    if (ln.price != null) bits.push(`${ln.qty} × ${money(ln.price)}`);
    else bits.push("Labor only");
    if (ln.labor != null) bits.push("Labor " + money(ln.labor));
    c.append(el("div", "det", bits.join(" · ")));
    const acts = el("div", "acts");
    acts.append(btn("Edit", "light", () => openForm(ln.price == null ? "labor" : "part", ln)),
                btn("Remove", "danger", () => removeLine(ln)));
    c.append(acts);
    return c;
  }));
}
function renderTotals() {
  const t = cur.totals || {parts: 0, labor: 0, total: 0};
  const row = (name, v, cls) => {
    const r = el("div", "tot" + (cls ? " " + cls : ""));
    r.append(el("span", "", name), el("span", "", money(v)));
    return r;
  };
  $("totals").replaceChildren(row("Parts", t.parts), row("Labor", t.labor), row("Total (before tax)", t.total, "sum"));

// Every change goes through one queue; each save takes the version of known[id], which the previous reply updated,
// so saves queued before leaving the job still go through.
function enqueue(fn) {
  pending++;
  const p = queue.then(fn).finally(() => { pending--; });
  queue = p.then(() => {}, () => {});
  return p;
}
const isStale = e => e.status === 409 && e.data.error === "changed on another device";

const LINE_KEYS = ["id", "desc", "qty", "price", "labor", "code"];
const sameLines = (a, b) => (a || []).length === (b || []).length &&
  a.every((x, i) => LINE_KEYS.every(k => (x[k] ?? null) === (b[i][k] ?? null)));

// build(t) -> {lines} from the newest known copy, or null for a fields-only save.
// fields: odometer/VIN/notes values captured now. A fields-only save that hits a stale version is retried once
// on the new version (last write wins); a lines save only when the new version has the same lines this phone
// built on (the desk took a deposit, say), else it would undo the other device's lines.
async function runSave(id, build, fields, keepalive) {
  for (let tries = 0; ; tries++) {
    const t = known[id];
    if (!t) return false;
    try {
      const body = Object.assign({version: t.version}, build ? build(t) : {}, fields);
      const r = await api(`/api/tickets/${id}`, body, null, keepalive);
      remember(r.data);
      draftSaved(id, fields);
      if (cur && cur.id === id) {
        setCur(r.data);
        for (const [bid, k] of FIELDS) {
          const box = $(bid);  // the server tidies values ("45,120" -> "45120"): show its copy, but not mid-typing
          if (k in fields && box.value === fields[k] && document.activeElement !== box) box.value = r.data[k] || "";
          if (k in fields) errBox(k).textContent = "";
        }
        showVinWarning();
        if (build) $("lerr").textContent = "";
      }
      saved();
      return true;
    } catch (e) {
      const fresh = isStale(e) && e.data.ticket && mineNow(e.data.ticket) ? e.data.ticket : null;
      const clash = fresh ? Object.keys(fields).filter(k => (fresh[k] || "") !== (t[k] || "")) : [];  // changed at the desk meanwhile
      if (tries === 0 && fresh && !clash.length && (!build || sameLines(fresh.lines, t.lines))) {
        remember(fresh);
        continue;
      }
      if (clash.length && cur && cur.id === id) {  // never over what the desk just typed: show theirs, say so
        for (const [bid, k] of FIELDS) if (clash.includes(k) && $(bid).value === fields[k]) $(bid).value = fresh[k] || "";
        for (const k of clash) if (queued[k] === fields[k]) delete queued[k];
        conflict(id, e, `The desk changed the ${clash.join(" and ")} just now. Showing the desk's; type yours again if it's still needed.`, !!build);
        return false;
      }
      conflict(id, e, build ? "Changed on another device, so that change wasn't saved. Showing the latest; try again." : "", !!build);
      if (build && isStale(e)) {  // typed boxes go again on the new version
        for (const k in fields) if (queued[k] === fields[k]) delete queued[k];
        saveFields();
      }
      return false;
    }
  }
}
function save(id, build, fields, keepalive, now) {
  // now: skip the queue (page closing while a save is in flight); a race with it ends in the stale retry above
  fields = fields || {};
  for (const k in fields) queued[k] = fields[k];
  const run = () => runSave(id, build, fields, keepalive);
  const p = now ? run() : enqueue(run);
  p.finally(() => { for (const k in fields) if (queued[k] === fields[k]) delete queued[k]; });
  return p;
}
function saveFields(keepalive) {  // send typed odometer/VIN/notes not already on their way
  if (!cur) return Promise.resolve(true);
  const f = saveableBoxes();
  if (!Object.keys(f).length) return Promise.resolve(true);
  return save(cur.id, null, f, keepalive, keepalive && pending > 0);
}
function conflict(id, e, staleText, lines) {
  if (e.status === 401) return;
  const here = cur && cur.id === id;
  if (e.status === 409 && e.data.ticket) {
    const t = e.data.ticket;
    remember(t);
    if (!here) return;
    if (!mineNow(t)) {
      say(t.status === "working" ? `This job is now ${t.mechanic || "someone else"}'s.` : `This job is ${t.status} now; the phone can't change it.`);
      return goHome();
    }
    setCur(t);
    say(isStale(e) ? (staleText || "Changed on another device. Showing the latest.") : errText(e));
  } else if (e.status === 410) {
    dropJob(id, GONE_TEXT);
  } else if (e.status === 404 || e.status === 403) {
    // 404: gone or someone else's; 403: not this mechanic's to change (e.g. waiting again). No saves go there now.
    writeDraft(id, {});
    if (here) {
      say(e.status === 403 ? "Not allowed: this job isn't yours anymore." : "This job isn't yours anymore, or it's gone.");
      cur = null;  // leave without leaveJob's save of the typed boxes: it would only be refused again
      clearFieldErrors();
      etag = "";
      goHome();
      poll();
    }
  } else if (e.status === 400 && here) {
    showErrors(e);
    const other = Object.keys((e.data && e.data.errors) || {}).filter(k => k !== "lines");
    if (lines && other.length) {  // the line was fine; a typed field that rode along wasn't
      const text = `Fix the ${other.join(" and ")} below first.`;
      if (editing) $("lerr").textContent = text;
      else say(text);
    }
  } else {
    say(errText(e));
  }
}

const typing = () => { keepDraft(); showVinWarning(); clearTimeout(fieldTimer); fieldTimer = setTimeout(saveFields, 800); };
for (const [id] of FIELDS) {
  $(id).addEventListener("input", typing);
  $(id).addEventListener("change", () => saveFields());
}
document.addEventListener("visibilitychange", () => {
  if (signingOut) return;
  if (document.hidden) { keepDraft(); saveFields(true); } else poll();
});
window.addEventListener("pagehide", () => { if (!signingOut) { keepDraft(); if (!reloading) saveFields(true); } });  // a session swap must not save under the new account
$("back").addEventListener("click", () => { if (discardLine()) goHome(); });
$("reload").addEventListener("click", async () => {
  if (!cur || !discardLine()) return;
  closeForm();
  say("");
  const id = cur.id;
  saveFields();
  await queue;
  if (!cur || cur.id !== id) return;
  if (Object.keys(dirtyBoxes()).length) return;  // couldn't save them: the error is under the box
  cur = null;  // makes loadJob replace everything
  loadJob(id);
});

// ---- add / edit a line
const formValues = () => ["ldesc", "lqty", "lprice", "llabor"].map(id => $(id).value).join("\u0000");
const lineTyped = () => !!editing && formValues() !== formStart;
function discardLine() {  // true when it's fine to go on (nothing half-typed, or the mechanic said discard)
  if (!lineTyped()) return true;
  if (!confirm("Discard this line?")) return false;
  closeForm();
  return true;
}
function openForm(mode, ln) {
  if (!cur || !discardLine()) return;
  editing = {mode, id: ln ? ln.id : 0};
  $("lftitle").textContent = (ln ? "Edit " : "Add ") + (mode === "part" ? "part" : "labor");
  $("ldesc").value = ln ? ln.desc : "";
  $("lqty").value = ln ? String(ln.qty) : "1";
  $("lprice").value = ln && ln.price != null ? plain(ln.price) : "";
  $("llabor").value = ln && ln.labor != null ? plain(ln.labor) : "";
  formStart = formValues();
  code = ln ? ln.code || "" : "";
  hintDesc = ln ? ln.desc : "";
  for (const e of document.querySelectorAll(".partonly")) e.hidden = mode !== "part";
  $("hints").replaceChildren();
  $("lerr").textContent = "";
  $("lineform").hidden = false;
  $("addbtns").hidden = true;
  $("lineform").scrollIntoView({block: "start", behavior: "smooth"});
  if (!ln) $("ldesc").focus();
}
function closeForm() {
  editing = null;
  clearTimeout(hintTimer);
  hintSeq++;
  $("lineform").hidden = true;
  $("addbtns").hidden = false;
  $("hints").replaceChildren();
  $("lerr").textContent = "";
}
$("addpart").addEventListener("click", () => openForm("part", null));
$("addlabor").addEventListener("click", () => openForm("labor", null));
$("lcancel").addEventListener("click", closeForm);

$("ldesc").addEventListener("input", () => {
  if (code && $("ldesc").value !== hintDesc) code = "";  // a changed description is no longer that catalog part
  if (!editing || editing.mode !== "part") return;
  clearTimeout(hintTimer);
  const q = $("ldesc").value.trim();
  const seq = ++hintSeq;
  if (q.length < 2) return $("hints").replaceChildren();
  hintTimer = setTimeout(async () => {
    try {
      const r = await api("/api/catalog?q=" + encodeURIComponent(q));
      if (seq !== hintSeq || !editing) return;  // typed more since, or closed
      showHints(Array.isArray(r.data) ? r.data : []);
    } catch (e) { /* hints are a nicety */ }
  }, 250);
});
function showHints(hits) {
  $("hints").replaceChildren(...hits.map(h => {
    const b = btn("", "", () => {
      $("ldesc").value = h.description;
      code = h.code || "";
      hintDesc = h.description;
      $("lprice").value = plain(h.part_price);
      $("llabor").value = plain(h.labor_price);
      hintSeq++;
      $("hints").replaceChildren();
    });
    b.append(el("span", "", h.description), el("small", "", `Part ${money(h.part_price)} · Labor ${money(h.labor_price)}`));
    return b;
  }));
}

$("lineform").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (!editing || !cur) return;
  const part = editing.mode === "part", id = editing.id;
  const ln = {desc: $("ldesc").value.trim(), qty: part ? $("lqty").value.trim() : 1,
              price: part ? $("lprice").value.trim() : null, labor: $("llabor").value.trim(), code};
  const bad = !ln.desc ? "Type a description." : part && !ln.price ? "Type the part price (0 if none)."
            : !part && !ln.labor ? "Type the labor charge." : "";
  $("lerr").textContent = bad;
  if (bad) return;
  $("lsave").disabled = true;
  const ok = await save(cur.id, t => {
    const lines = t.lines.map(x => Object.assign({}, x));
    const i = id ? lines.findIndex(x => x.id === id) : -1;
    if (i >= 0) lines[i] = Object.assign({}, ln, {id});
    else lines.push(Object.assign({}, ln, {id: 0}));
    return {lines};
  }, saveableBoxes());
  $("lsave").disabled = false;
  if (ok && editing && editing.id === id) closeForm();
});
function saveableBoxes() {  // typed odometer/VIN/notes ride along with a lines save
  clearTimeout(fieldTimer);
  const f = dirtyBoxes();
  for (const k of Object.keys(f)) if (queued[k] === f[k]) delete f[k];
  return f;
}

function removeLine(ln) {
  if (!cur || !confirm(`Remove "${ln.desc}"?`)) return;
  save(cur.id, t => ({lines: t.lines.filter(x => x.id !== ln.id)}), saveableBoxes());
}

$("finish").addEventListener("click", async () => {
  if (!cur || cur.status !== "working") return;
  if (lineTyped()) {
    $("lerr").textContent = "Save or cancel this line first.";
    return $("lineform").scrollIntoView({block: "start", behavior: "smooth"});
  }
  if (!confirm("Finish this job and send it to the desk?")) return;
  closeForm();
  const id = cur.id;
  $("finish").disabled = true;
  try {
    saveFields();
    await queue;
    if (!cur || cur.id !== id) return;
    if (Object.keys(dirtyBoxes()).length) {  // a typed box didn't save: say so and stay
      if (FIELDS.every(f => !$(f[2]).textContent) && $("msg").hidden) say("Couldn't save the odometer, VIN or notes. Try again.");
      return;
    }
    await enqueue(async () => {
      try {
        await api(`/api/tickets/${id}/move`, {version: known[id].version, to: "review"});
        writeDraft(id, {});
        etag = "";
        goHome();
        say("Sent to the desk for review.", true);
        poll();
      } catch (e) {
        const sent = e.status === 409 && e.data.ticket && e.data.ticket.status === "approved";
        conflict(id, e, sent ? "The desk already sent this one to InvoMax. You can still fix it here."
                             : "Changed on another device. Showing the latest; check it and tap Finish again.");
      }
    });
  } finally {
    $("finish").disabled = false;
  }
});

// ---- delete my job (a modal asks first; the desk can restore it)
function confirmDelete(t, opener) {  // -> true when Delete was pressed; Esc or Cancel -> false. Focus goes back to opener.
  const dlg = $("deldlg");
  $("deltitle").textContent = `Delete ticket #${t.id} — ` +
    [[t.first, t.last].filter(Boolean).join(" ") || "(no name)", t.plate, money((t.totals || {}).total)].filter(Boolean).join(", ") + "?";
  // the phone can't see deposits, which keep a deleted ticket for good (R10): no "14 days" promise here
  $("delkeep").textContent = KEPT.includes(t.status) ? "This ticket stays in the records." : "The desk can restore it.";
  dlg.returnValue = "";
  dlg.showModal();
  $("delno").focus();
  return new Promise(ok => dlg.addEventListener("close", () => {
    if (opener.isConnected) opener.focus();
    ok(dlg.returnValue === "delete");
  }, {once: true}));
}
$("deljob").addEventListener("click", async ev => {
  const t = cur, opener = ev.currentTarget;
  if (!t || !discardLine()) return;
  if (!(await confirmDelete(t, opener)) || !cur || cur.id !== t.id) return;
  closeForm();
  say("");
  const id = t.id;
  opener.disabled = true;
  try {
    await enqueue(async () => {  // after any save on its way: known[id] has the version it left
      if (!known[id]) return;
      try {
        await api(`/api/tickets/${id}/delete`, {version: known[id].version});
        dropJob(id, KEPT.includes(t.status) ? "Deleted. It stays in the desk's records." : "Deleted. The desk can restore it.", true);
      } catch (e) {
        if (e.status === 403) say(NOT_HERE);
        else conflict(id, e, "Changed on another device. Showing the latest; check it and tap Delete again.");
      }
    });
  } finally {
    opener.disabled = false;
  }
});

// ---- new customer: the mechanic checks a customer in (the check-in iPad is retired); it waits for whoever accepts it

const custBox = k => $("custform").elements[k];

function newToken() {  // as the desk's: the same token again (its reply was lost) is the same ticket, not a second one
  const a = new Uint8Array(16);

  return [...a].map(x => x.toString(16).padStart(2, "0")).join("");
}

}

$("custform").addEventListener("submit", async ev => {
  ev.preventDefault();
  if (custBusy) return;
  clearCustErrors();
  const body = {};
  for (const k of CUST) body[k] = custBox(k).value;
  if (!CUST.some(k => body[k].trim())) { $("cerr").textContent = "Type the customer and the car first."; return; }
  custToken = custToken || newToken();  // kept until it goes through: a retry is the same check-in
  body.token = custToken;
  custBusy = true;
  $("csave").disabled = true;
  try {
    const t = (await api("/api/tickets", body)).data;
    closeCust();
    if (t.status === "waiting") {
      checkedIn.push({t, after: polls});  // until a poll started after now answers (see poll)
      if (!list.some(x => x.id === t.id)) list = [t, ...list];  // newest first, as the server sends
    }
    renderHome();
    say(`Checked in: ${shortName(t) || "the customer"}. The job is under Waiting.`, true);
    etag = "";
    poll();
  } catch (e) {
    if (e.status === 400) {
      const errs = (e.data && e.data.errors) || {}, rest = [];
      for (const [k, v] of Object.entries(errs)) {  // only keys the form has go next to a box: never a selector from the reply
        const p = CUST.includes(k) ? $("custform").querySelector(`.ferr[data-for="${k}"]`) : null;
        if (p) p.textContent = cap(String(v)); else rest.push(cap(String(v)));
      }
      $("cerr").textContent = rest.length ? rest.join("\n") : Object.keys(errs).length ? "" : errText(e);
    } else if (e.status === 403) $("cerr").textContent = NOT_HERE;
    else if (e.status === 410) { closeCust(); say(GONE_TEXT); }  // sent before, and the desk removed it since
    else if (e.status !== 401) $("cerr").textContent = errText(e);
  } finally {
    custBusy = false;
    $("csave").disabled = false;
  }
});

// year / make / model lists from vehicles.json (as on the desk's page); typing anything still works
const FIRST_YEAR = 1990, NEXT_YEAR = new Date().getFullYear() + 1;
const MAKE_ALIAS = {CHEVY: "CHEVROLET", VW: "VOLKSWAGEN", MERCEDES: "MERCEDES-BENZ", BENZ: "MERCEDES-BENZ",
                    "MERCEDES BENZ": "MERCEDES-BENZ", LANDROVER: "LAND ROVER"};
let CARS = {}, modelsShown = null, carsLoading = false;  // {"MAKE": {"MODEL": [first, last]}}; the make|year listed
const squash = s => String(s ?? "").trim().split(/\s+/).join(" ").toUpperCase();
function fillList(id, items) {
  $(id).replaceChildren(...items.map(v => { const o = document.createElement("option"); o.value = v; return o; }));
}
async function loadVehicles() {  // when the form opens, until it has come once
  if (carsLoading || Object.keys(CARS).length) return;
  carsLoading = true;
  try {
    const d = (await api("/api/vehicles")).data;
    if (!Array.isArray(d)) { CARS = d; fillList("make-list", Object.keys(d)); modelsShown = null; }
  } catch (e) { /* free text only */ } finally { carsLoading = false; }
}
function refreshModels() {  // models of the make typed; of the typed year when it has any
  const make = MAKE_ALIAS[squash(custBox("make").value)] || squash(custBox("make").value), y = Number(custBox("year").value);
  const year = /^[0-9]{4}$/.test(custBox("year").value.trim()) && y >= FIRST_YEAR && y <= NEXT_YEAR ? y : 0;
  if (modelsShown === make + "|" + year) return;
  modelsShown = make + "|" + year;
  const models = Object.entries(CARS[make] || {});
  const built = models.filter(([, r]) => Array.isArray(r) && r[0] <= year && year <= r[1]);
  fillList("model-list", (year && built.length ? built : models).map(([m]) => m));  // none that year: all of them
}
for (const k of ["year", "make", "model"]) {
  for (const e of ["focus", "input", "change"]) custBox(k).addEventListener(e, refreshModels);
}

// ---- start
fillList("year-list", Array.from({length: NEXT_YEAR - FIRST_YEAR + 1}, (_, i) => String(NEXT_YEAR - i)));
setInterval(poll, 4000);
whoAmI();
</script>
</body></html>
